<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAP LIQUID 3 - Factory UI</title>
  <style>
    :root {
      --bg-main: #0b0f19; --bg-panel: #111827; --border: #1e293b; --grid-line: #1e293b; 
      --text-main: #f9fafb; --running: #22c55e; --setup: #eab308; --down: #dc2626; --offplan: #6b7280;
      --cqi-ready: #3b82f6; --cqi-off: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: -apple-system, sans-serif; background: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: var(--bg-panel); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 30; position: relative; }
    .brand { font-weight: 700; font-size: 1.1rem; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { background: #4b5563; color: white; border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { background: #374151; }
    .btn-primary { background: var(--cqi-ready); border: none; }
    .btn-success { background: var(--running); border: none; }
    .btn-warning { background: var(--setup); border: none; }
    .btn-danger { background: var(--down); border: none; }
    
    /* LAYOUT UTAMA & SLIDING PANEL */
    .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
    
    .side-panel {
      width: 280px;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: margin-left 0.3s ease;
      z-index: 20;
    }
    .side-panel.closed { margin-left: -280px; }
    
    .panel-toggle-btn {
      position: absolute;
      left: 280px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 48px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-left: none;
      border-radius: 0 8px 8px 0;
      color: #94a3b8;
      cursor: pointer;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: left 0.3s ease, background 0.2s;
      box-shadow: 3px 0 6px rgba(0,0,0,0.3);
    }
    .panel-toggle-btn:hover { background: #334155; color: white; }
    .side-panel.closed ~ .panel-toggle-btn { left: 0; }

    .panel-header { padding: 15px; border-bottom: 1px solid var(--border); background: #0f172a; }
    .panel-header h3 { font-size: 0.95rem; color: #f1f5f9; margin: 0; font-weight: 700; text-align: center; }
    
    .panel-body { padding: 15px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 15px; }
    
    /* STATISTIK DI PANEL */
    .stats-box { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px; font-size: 0.8rem; color: #94a3b8; display: flex; flex-direction: column; gap: 6px; }
    .stat-line { display: flex; justify-content: space-between; }
    .stat-val { font-weight: 700; color: #e2e8f0; }

    /* TOMBOL WORKSTATION (0A, 1A, Dst) */
    .ws-group { margin-bottom: 10px; }
    .ws-group-title { font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; font-weight: bold; border-bottom: 1px dashed #334155; padding-bottom: 4px; }
    .ws-group-buttons { display: flex; flex-wrap: wrap; gap: 5px; }
    .ws-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: 600; transition: all 0.2s; flex: 1 1 calc(33.333% - 5px); text-align: center; }
    .ws-btn:hover { background: #334155; color: white; }
    .ws-btn.active-all { background: #16a34a; color: white; border-color: #22c55e; box-shadow: 0 0 6px rgba(34, 197, 94, 0.4); }
    .ws-btn.active-partial { background: #ca8a04; color: white; border-color: #eab308; }

    /* VIEWPORT DAN BUNGKUSAN GRID (UNTUK LOCK SCROLL) */
    /* Diubah overflow menjadi hidden sebagai default */
    .map-viewport { flex: 1; overflow: hidden; background: #030712; position: relative; }
    .grid-wrapper { overflow: hidden; transform-origin: top left; }
    .factory-grid { position: relative; display: grid; border: 1px solid var(--border); background: #030712; transform-origin: top left; }
    
    .excel-header { background: #1e293b; color: #94a3b8; font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 1px solid #334155; user-select: none; z-index: 5; }
    .excel-corner { background: #0f172a; color: #64748b; font-size: 0.85rem; }
    .grid-cell { border: 1px solid var(--grid-line); min-width: 78px; min-height: 52px; display: flex; align-items: center; justify-content: center; position: relative; z-index: 2; }

    /* Line Box */
    .line-box {
      position: relative; border: 3px dashed #3b82f6; background: transparent; border-radius: 0; z-index: 1; 
      box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-start; pointer-events: none; 
    }
    body.mode-edit .line-box { border-style: dashed; background: rgba(255, 255, 255, 0.02); z-index: 3; }
    body.mode-edit .line-box-header { cursor: grab; }
    body.mode-edit .line-box-header:active { cursor: grabbing; }
    .line-box-header {
      font-size: 0.75rem; font-weight: 800; color: #60a5fa; background: rgba(15, 23, 42, 0.9);
      padding: 4px 8px; width: max-content; pointer-events: auto; letter-spacing: 0.5px;
      border-bottom-right-radius: 6px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }
    .resize-handle {
      width: 14px; height: 14px; background: #3b82f6; border: 2px solid #ffffff; border-radius: 3px;
      position: absolute; bottom: -6px; right: -6px; cursor: se-resize; display: none; z-index: 20; pointer-events: auto; 
    }
    body.mode-edit .resize-handle { display: block; }

    /* Node Style */
    .node { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; text-align: center; cursor: pointer; border-radius: 4px; position: relative; transition: all 0.2s; padding: 2px; z-index: 10; }
    .node-machine.OFF { background: var(--offplan); color: white; }
    .node-machine.RUNNING { background: var(--running); color: white; box-shadow: inset 0 0 10px rgba(255,255,255,0.3); }
    .node-cqi.OFF { background: var(--cqi-off); color: white; }
    .node-cqi.READY { background: var(--cqi-ready); color: white; border: 2px solid white; box-shadow: 0 0 10px var(--cqi-ready); }
    .node-label { background: transparent; color: #94a3b8; border: 1px dashed #475569; font-size: 0.85rem; }

    .del-btn { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; display: none; line-height: 16px; text-align: center; cursor: pointer; z-index: 15; pointer-events: auto; }
    body.mode-edit .del-btn { display: block; }
    body.mode-edit .node { cursor: grab; }
    body.mode-landing .control-edit { display: none; }
    body.mode-edit .control-landing { display: none; }

    .heatmap-good { box-shadow: inset 0 0 20px rgba(34, 197, 94, 0.6) !important; border: 1px solid #22c55e; }
    .heatmap-warn { box-shadow: inset 0 0 20px rgba(234, 179, 8, 0.6) !important; border: 1px solid #eab308; }
    .heatmap-bad { box-shadow: inset 0 0 20px rgba(239, 68, 68, 0.6) !important; border: 1px solid #ef4444; }

    .zoom-controls { position: fixed; bottom: 30px; right: 30px; display: flex; gap: 10px; z-index: 1000; }
    .zoom-btn { background: rgba(30, 41, 59, 0.9); border: 1px solid #334155; color: white; width: 45px; height: 45px; border-radius: 8px; cursor: pointer; font-size: 1.4rem; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .zoom-btn:hover { background: #334155; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; width: 340px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); transform: translateY(-20px); transition: transform 0.2s ease; }
    .modal-overlay.active .modal-card { transform: translateY(0); }
    .modal-card h3 { margin-bottom: 15px; font-size: 1.1rem; }
    .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.8rem; color: #9ca3af; }
    .form-control { background: var(--bg-main); border: 1px solid var(--border); color: white; padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; outline: none; }
    .form-control:focus { border-color: var(--cqi-ready); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body class="mode-landing">
  <header>
    <div class="brand">🏭 MAP LIQUID 3</div>
    <div class="controls">
      <button class="btn btn-warning control-landing" onclick="toggleEditMode()">✏️ Edit MAP</button>
      <!-- Tombol Run MC dan Off All sudah dipindah ke panel kiri -->
      <button class="btn control-landing" onclick="toggleHeatmap()">🔥 Heatmap</button>
      <button class="btn btn-primary control-landing" onclick="goToConfig()">Lanjut Konfigurasi ➔</button>

      <button class="btn btn-primary control-edit" onclick="openNodeModal('machine')">➕ Mesin</button>
      <button class="btn btn-primary control-edit" onclick="openNodeModal('cqi')">➕ CQI</button>
      <button class="btn btn-primary control-edit" onclick="openNodeModal('label')">➕ Label</button>
      <button class="btn btn-primary control-edit" onclick="openNodeModal('line')">➕ Batas Line</button>
      <button class="btn btn-success control-edit" onclick="exportMapJson()">💾 Save to map.json</button>
      <button class="btn control-edit" onclick="toggleEditMode()">⬅️ Selesai Edit</button>
    </div>
  </header>

  <div class="main-layout">
    <!-- PANEL GESER KIRI -->
    <div class="side-panel control-landing" id="sidePanel">
      <div class="panel-header">
        <h3>(Runing / Line)</h3>
      </div>
      <div class="panel-body">
        <!-- Posisi baru untuk Tombol MC Control -->
        <div style="display: flex; gap: 8px; margin-bottom: 5px;">
          <button class="btn btn-success" style="flex: 1; justify-content: center; font-size: 0.75rem;" onclick="setAllMachinesRunning()">🏃 Run All</button>
          <button class="btn btn-danger" style="flex: 1; justify-content: center; font-size: 0.75rem;" onclick="setAllMachinesOff()">🛑 Off All</button>
        </div>

        <div class="stats-box">
          <div class="stat-line"><span>Mesin Running:</span> <span class="stat-val" id="statMachine">0 / 0</span></div>
          <div class="stat-line"><span>CQI Terpakai:</span> <span class="stat-val" id="statCqi">0 / 0</span></div>
        </div>
        <div id="wsBtnContainer"></div>
      </div>
    </div>
    
    <div class="panel-toggle-btn control-landing" onclick="toggleSidePanel()" id="panelToggleBtn">◀</div>

    <div class="map-viewport" id="mapViewport">
      <div class="grid-wrapper" id="gridWrapper">
        <div class="factory-grid" id="factoryGrid"></div>
      </div>
    </div>
    
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoomOut()">-</button>
      <button class="zoom-btn" onclick="zoomIn()">+</button>
    </div>
  </div>

  <div class="modal-overlay" id="nodeModal">
    <div class="modal-card">
      <h3 id="modalTitle">Tambah Node</h3>
      <div id="modalFormContainer"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeNodeModal()">Batal</button>
        <button class="btn btn-primary" onclick="submitNodeModal()">Simpan</button>
      </div>
    </div>
  </div>

  <script src="brain.js"></script>
  <script>
    let mapData = { machines: [], cqis: [], labels: [], lines: [] };
    // Set inisial currentZoom ke 0 agar saat loading akan otomatis terkunci ke zoom-out paling maksimal
    let currentZoom = 0; 
    let editMode = false;
    let showHeatmap = false;
    let draggedNode = null;
    let activeModalType = '';

    const GRID_WIDTH = 4330;
    const GRID_HEIGHT = 1068;

    const mapViewport = document.getElementById('mapViewport');
    mapViewport.addEventListener('wheel', (e) => {
      if (e.deltaY !== 0) {
        e.preventDefault();
        mapViewport.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    function getColLetter(col) {
      let letter = '';
      while (col > 0) {
        let rem = (col - 1) % 26;
        letter = String.fromCharCode(65 + rem) + letter;
        col = Math.floor((col - 1) / 26);
      }
      return letter;
    }

    async function loadMap() {
      const githubUrl = 'https://raw.githubusercontent.com/IPCQuality/PLANING-MAKER/refs/heads/main/map.json';
      try {
        const res = await fetch(githubUrl);
        if (!res.ok) throw new Error("Gagal load dari GitHub");
        mapData = await res.json();
      } catch (e) {
        console.warn("Gagal load data dari Github, mencoba fetch lokal map.json", e);
        try {
          const resLocal = await fetch('map.json');
          if (resLocal.ok) mapData = await resLocal.json();
        } catch(err) {
          mapData = { machines: [], cqis: [], labels: [], lines: [] };
        }
      }
      initializeStatuses();
      renderWorkstationButtons();
      applyZoom();
    }

    function initializeStatuses() {
      if (!mapData.lines || mapData.lines.length === 0) {
        mapData.lines = [
          { id: 'line-a', name: 'LINE A', row: 2, col: 4, width: 24, height: 8, borderColor: '#3b82f6', textColor: '#60a5fa' },
          { id: 'line-b', name: 'LINE B', row: 11, col: 4, width: 27, height: 6, borderColor: '#3b82f6', textColor: '#60a5fa' },
          { id: 'line-c', name: 'LINE C', row: 13, col: 32, width: 22, height: 5, borderColor: '#3b82f6', textColor: '#60a5fa' }
        ];
      }

      // Cek apakah ada data tersimpan di localStorage untuk restore status terakhir
      const savedState = localStorage.getItem('factory_internal_storage');
      if (savedState) {
        try {
          const parsed = JSON.parse(savedState);
          
          // Restore status mesin
          if (parsed.machines) {
            parsed.machines.forEach(savedM => {
              let targetM = mapData.machines.find(m => m.id === savedM.id || m.name === savedM.name);
              if (targetM) targetM.status = savedM.status;
            });
          }

          // Restore status CQI
          if (parsed.cqis) {
            parsed.cqis.forEach(savedC => {
              let targetC = mapData.cqis.find(c => c.id === savedC.id || c.name === savedC.name);
              if (targetC) targetC.status = savedC.status;
            });
          }
        } catch (err) {
          console.error("Gagal memuat status dari internal storage:", err);
        }
      } else {
        mapData.machines.forEach(m => { if (m.status !== 'RUNNING') m.status = 'OFF'; });
        mapData.cqis.forEach(c => { if (c.status !== 'READY') c.status = 'OFF'; });
      }

      renderGrid();
    }

    function renderWorkstationButtons() {
      const container = document.getElementById('wsBtnContainer');
      if (!container) return;
      container.innerHTML = '';

      const groups = [
        { title: "LINE A", keys: ["0A", "1A", "2A", "3A", "4A", "5A", "6A", "7A", "8A", "9A", "10A"] },
        { title: "LINE B", keys: ["0B", "1B", "2B", "3B", "4B", "5B", "6B", "7B", "8B", "9B", "10B", "11B"] },
        { title: "LINE C", keys: ["1C", "2C", "3C", "4C", "5C", "6C", "7C", "8C", "9C", "10C"] },
        { title: "OTHERS", keys: ["WW", "OT"] }
      ];

      groups.forEach(g => {
        let groupDiv = document.createElement('div');
        groupDiv.className = 'ws-group';
        
        let titleDiv = document.createElement('div');
        titleDiv.className = 'ws-group-title';
        titleDiv.innerText = g.title;
        groupDiv.appendChild(titleDiv);

        let btnsDiv = document.createElement('div');
        btnsDiv.className = 'ws-group-buttons';
        
        g.keys.forEach(key => {
          let btn = document.createElement('button');
          btn.className = 'ws-btn';
          btn.innerText = key;
          btn.id = 'ws-btn-' + key;
          btn.onclick = () => toggleWorkstation(key);
          btnsDiv.appendChild(btn);
        });
        
        groupDiv.appendChild(btnsDiv);
        container.appendChild(groupDiv);
      });

      updateStatsAndButtons();
    }

    function updateStatsAndButtons() {
      const totalMac = mapData.machines.length;
      const runMac = mapData.machines.filter(m => m.status === 'RUNNING').length;
      document.getElementById('statMachine').innerText = `${runMac} / ${totalMac}`;

      const totalCqi = mapData.cqis.length;
      const readyCqi = mapData.cqis.filter(c => c.status === 'READY').length;
      document.getElementById('statCqi').innerText = `${readyCqi} / ${totalCqi}`;

      if (typeof WORKSTATIONS === 'undefined') return;

      for (let key in WORKSTATIONS) {
        let btn = document.getElementById('ws-btn-' + key);
        if (!btn) continue;

        let wsList = WORKSTATIONS[key];
        let wsMachines = mapData.machines.filter(m => {
          return wsList.some(item => BrainAI.normalizeName(m.name) === BrainAI.normalizeName(item));
        });

        if (wsMachines.length === 0) {
          btn.className = 'ws-btn';
          continue;
        }

        let runningCount = wsMachines.filter(m => m.status === 'RUNNING').length;
        if (runningCount === wsMachines.length) {
          btn.className = 'ws-btn active-all';
        } else if (runningCount > 0) {
          btn.className = 'ws-btn active-partial';
        } else {
          btn.className = 'ws-btn';
        }
      }
    }

    function toggleWorkstation(wsKey) {
      if (typeof WORKSTATIONS === 'undefined' || !WORKSTATIONS[wsKey]) return;

      let wsList = WORKSTATIONS[wsKey];
      let wsMachines = mapData.machines.filter(m => {
        return wsList.some(item => BrainAI.normalizeName(m.name) === BrainAI.normalizeName(item));
      });

      if (wsMachines.length === 0) {
        alert(`Tidak ada mesin yang cocok dengan Workstation ${wsKey} di map.`);
        return;
      }

      let allRunning = wsMachines.every(m => m.status === 'RUNNING');
      let targetStatus = allRunning ? 'OFF' : 'RUNNING';

      wsMachines.forEach(m => m.status = targetStatus);

      renderGrid();
    }

    function toggleSidePanel() {
      const panel = document.getElementById('sidePanel');
      const btn = document.getElementById('panelToggleBtn');
      panel.classList.toggle('closed');
      btn.innerText = panel.classList.contains('closed') ? '▶' : '◀';
      
      setTimeout(applyZoom, 300); 
    }

    function renderGrid() {
      const grid = document.getElementById('factoryGrid');
      grid.innerHTML = '';
      
      let totalCols = 55;
      let totalRows = 20;

      grid.style.gridTemplateColumns = `40px repeat(${totalCols}, 78px)`;
      grid.style.gridTemplateRows = `28px repeat(${totalRows}, 52px)`;

      let corner = document.createElement('div');
      corner.className = 'excel-header excel-corner';
      corner.innerText = 'R\\C';
      corner.style.gridRow = '1';
      corner.style.gridColumn = '1';
      grid.appendChild(corner);

      for (let c = 1; c <= totalCols; c++) {
        let colHeader = document.createElement('div');
        colHeader.className = 'excel-header';
        colHeader.innerText = getColLetter(c);
        colHeader.style.gridRow = '1';
        colHeader.style.gridColumn = `${c + 1}`;
        grid.appendChild(colHeader);
      }

      for (let r = 1; r <= totalRows; r++) {
        let rowHeader = document.createElement('div');
        rowHeader.className = 'excel-header';
        rowHeader.innerText = r;
        rowHeader.style.gridRow = `${r + 1}`;
        rowHeader.style.gridColumn = '1';
        grid.appendChild(rowHeader);

        for (let c = 1; c <= totalCols; c++) {
          let cell = document.createElement('div');
          cell.className = 'grid-cell';
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.style.gridRow = `${r + 1}`;
          cell.style.gridColumn = `${c + 1}`;
          cell.ondragover = e => e.preventDefault();
          cell.ondrop = e => handleDrop(e, r, c);
          grid.appendChild(cell);
        }
      }

      if (mapData.lines) {
        mapData.lines.forEach(line => {
          let lineEl = document.createElement('div');
          lineEl.className = 'line-box';
          lineEl.id = line.id;
          lineEl.style.gridRow = `${line.row + 1} / span ${line.height}`;
          lineEl.style.gridColumn = `${line.col + 1} / span ${line.width}`;
          lineEl.style.borderColor = line.borderColor || '#3b82f6';

          let titleEl = document.createElement('div');
          titleEl.className = 'line-box-header';
          titleEl.innerText = line.name;
          if (line.textColor) titleEl.style.color = line.textColor;
          lineEl.appendChild(titleEl);

          if (editMode) {
            lineEl.draggable = true;
            lineEl.ondragstart = (e) => {
              if (e.target.classList.contains('resize-handle') || e.target.classList.contains('del-btn')) return;
              draggedNode = { node: line, type: 'line' };
              e.dataTransfer.setData('text/plain', line.id);
            };

            let delBtn = document.createElement('div');
            delBtn.className = 'del-btn';
            delBtn.innerText = 'X';
            delBtn.style.top = '2px'; delBtn.style.right = '2px';
            delBtn.onclick = (e) => { e.stopPropagation(); deleteNode(line.id, 'line'); };
            lineEl.appendChild(delBtn);

            let handle = document.createElement('div');
            handle.className = 'resize-handle';
            handle.style.backgroundColor = line.borderColor || '#3b82f6';
            handle.onmousedown = (e) => { e.stopPropagation(); e.preventDefault(); initResizeLine(e, line); };
            lineEl.appendChild(handle);
          }

          grid.appendChild(lineEl);
        });
      }

      const appendToGrid = (node, type) => {
        let cell = document.querySelector(`.grid-cell[data-row="${node.row}"][data-col="${node.col}"]`);
        if (!cell) return;

        let div = document.createElement('div');
        div.className = `node node-${type} ${node.status || ''}`;
        div.innerHTML = `<span>${node.name}</span>`;
        div.id = node.id;

        if (editMode) {
          div.draggable = true;
          div.ondragstart = e => handleDragStart(e, node, type);
          let delBtn = document.createElement('div');
          delBtn.className = 'del-btn';
          delBtn.innerText = 'X';
          delBtn.onclick = (e) => { e.stopPropagation(); deleteNode(node.id, type); };
          div.appendChild(delBtn);
        } else {
          if (type === 'machine' || type === 'cqi') div.onclick = () => cycleStatus(node, type);
        }

        if (showHeatmap && type === 'machine' && node.status === 'RUNNING') {
          let dist = getMinCqiDistance(node);
          if (dist <= 5) div.classList.add('heatmap-good');
          else if (dist <= 10) div.classList.add('heatmap-warn');
          else div.classList.add('heatmap-bad');
        }
        
        cell.appendChild(div);
      };

      mapData.machines.forEach(m => appendToGrid(m, 'machine'));
      mapData.cqis.forEach(c => appendToGrid(c, 'cqi'));
      mapData.labels.forEach(l => appendToGrid(l, 'label'));

      if (showHeatmap) {
        const svgNS = "http://www.w3.org/2000/svg";
        let svg = document.createElementNS(svgNS, "svg");
        svg.style.position = "absolute"; svg.style.top = "0"; svg.style.left = "0";
        svg.style.width = "100%"; svg.style.height = "100%";
        svg.style.pointerEvents = "none"; svg.style.zIndex = "8";

        mapData.machines.forEach(m => {
          if (m.status === 'RUNNING') {
            let readyCqis = mapData.cqis.filter(c => c.status === 'READY');
            if (readyCqis.length > 0) {
              let nearest = readyCqis[0];
              let minDist = Math.sqrt(Math.pow(m.row - nearest.row, 2) + Math.pow(m.col - nearest.col, 2));
              
              for (let i = 1; i < readyCqis.length; i++) {
                let d = Math.sqrt(Math.pow(m.row - readyCqis[i].row, 2) + Math.pow(m.col - readyCqis[i].col, 2));
                if (d < minDist) { minDist = d; nearest = readyCqis[i]; }
              }

              let startX = 40 + (m.col - 1) * 78 + 39;
              let startY = 28 + (m.row - 1) * 52 + 26;
              let endX = 40 + (nearest.col - 1) * 78 + 39;
              let endY = 28 + (nearest.row - 1) * 52 + 26;

              let line = document.createElementNS(svgNS, "line");
              line.setAttribute("x1", startX); line.setAttribute("y1", startY);
              line.setAttribute("x2", endX); line.setAttribute("y2", endY);
              
              if (minDist <= 5) line.setAttribute("stroke", "#22c55e");
              else if (minDist <= 10) line.setAttribute("stroke", "#eab308");
              else line.setAttribute("stroke", "#ef4444");

              line.setAttribute("stroke-width", "3");
              line.setAttribute("stroke-dasharray", "8,5");
              svg.appendChild(line);
            }
          }
        });
        grid.appendChild(svg);
      }
      updateStatsAndButtons();
    }

    function applyZoom() {
      const viewport = document.getElementById('mapViewport');
      const minZoomX = viewport.clientWidth / GRID_WIDTH;
      const minZoomY = viewport.clientHeight / GRID_HEIGHT;
      const minZoom = Math.max(minZoomX, minZoomY);

      // Logika scrollbar dan auto max-zoom-out
      if (currentZoom <= minZoom) {
        currentZoom = minZoom;
        viewport.style.overflow = 'hidden'; // Menghilangkan bar saat zoom mentok out
      } else {
        viewport.style.overflow = 'auto';   // Memunculkan bar saat di-zoom in
      }

      if (currentZoom > 3) currentZoom = 3;

      document.getElementById('factoryGrid').style.transform = `scale(${currentZoom})`;
      
      const wrapper = document.getElementById('gridWrapper');
      wrapper.style.width = `${GRID_WIDTH * currentZoom}px`;
      wrapper.style.height = `${GRID_HEIGHT * currentZoom}px`;
    }

    function zoomIn() { currentZoom += 0.1; applyZoom(); }
    function zoomOut() { currentZoom -= 0.1; applyZoom(); }
    window.addEventListener('resize', applyZoom);

    function initResizeLine(e, line) {
      let startX = e.clientX, startY = e.clientY;
      let startW = line.width, startH = line.height;

      function onMouseMove(moveEvent) {
        let dx = moveEvent.clientX - startX; let dy = moveEvent.clientY - startY;
        let colDelta = Math.round(dx / (78 * currentZoom)); let rowDelta = Math.round(dy / (52 * currentZoom));
        let newW = Math.max(1, startW + colDelta); let newH = Math.max(1, startH + rowDelta);

        if (newW !== line.width || newH !== line.height) {
          line.width = newW; line.height = newH;
          let lineEl = document.getElementById(line.id);
          if (lineEl) {
            lineEl.style.gridColumn = `${line.col + 1} / span ${line.width}`;
            lineEl.style.gridRow = `${line.row + 1} / span ${line.height}`;
          }
        }
      }
      function onMouseUp() { document.removeEventListener('mousemove', onMouseMove); document.removeEventListener('mouseup', onMouseUp); renderGrid(); }
      document.addEventListener('mousemove', onMouseMove); document.addEventListener('mouseup', onMouseUp);
    }

    function setAllMachinesRunning() { mapData.machines.forEach(m => m.status = 'RUNNING'); renderGrid(); }
    function setAllMachinesOff() { mapData.machines.forEach(m => m.status = 'OFF'); renderGrid(); }

    function cycleStatus(node, type) {
      if (type === 'machine') {
        const s = ['OFF', 'RUNNING']; node.status = s[(s.indexOf(node.status) + 1) % s.length];
      } else if (type === 'cqi') {
        const s = ['OFF', 'READY']; node.status = s[(s.indexOf(node.status) + 1) % s.length];
      }

      if(showHeatmap) renderGrid();
      else {
        let el = document.getElementById(node.id);
        if(el) el.className = `node node-${type} ${node.status}`;
        updateStatsAndButtons();
      }
    }

    function getMinCqiDistance(machine) {
      let readyCqis = mapData.cqis.filter(c => c.status === 'READY');
      if (readyCqis.length === 0) return Infinity;
      return Math.min(...readyCqis.map(c => Math.sqrt(Math.pow(machine.row - c.row, 2) + Math.pow(machine.col - c.col, 2))));
    }

    function handleDragStart(e, node, type) { draggedNode = { node, type }; e.dataTransfer.setData('text/plain', node.id); }
    function handleDrop(e, r, c) { if (!editMode || !draggedNode) return; e.preventDefault(); draggedNode.node.row = r; draggedNode.node.col = c; draggedNode = null; renderGrid(); }
    
    function deleteNode(id, type) {
      if (!confirm('Hapus item ini?')) return;
      if (type === 'machine') mapData.machines = mapData.machines.filter(m => m.id !== id);
      if (type === 'cqi') mapData.cqis = mapData.cqis.filter(c => c.id !== id);
      if (type === 'label') mapData.labels = mapData.labels.filter(l => l.id !== id);
      if (type === 'line') mapData.lines = mapData.lines.filter(l => l.id !== id);
      renderGrid();
    }

    function openNodeModal(type) {
      activeModalType = type;
      const container = document.getElementById('modalFormContainer');
      const title = document.getElementById('modalTitle');
      container.innerHTML = '';

      if (type === 'machine') {
        title.innerText = "Tambah Mesin Baru"; container.innerHTML = `<div class="form-group"><label>Nama Mesin</label><input type="text" id="macName" class="form-control" placeholder="Contoh: AST 33-16L" required></div>`;
      } else if (type === 'cqi') {
        title.innerText = "Tambah CQI Baru"; container.innerHTML = `<div class="form-group"><label>Nama CQI</label><input type="text" id="cqiName" class="form-control" placeholder="Contoh: CQI-01" required></div>`;
      } else if (type === 'label') {
        title.innerText = "Tambah Label Baru"; container.innerHTML = `<div class="form-group"><label>Nama Label</label><input type="text" id="lblName" class="form-control" placeholder="Contoh: 0A" required></div><div class="form-group"><label>Baris (Row)</label><input type="number" id="lblRow" class="form-control" value="5" min="1" required></div><div class="form-group"><label>Kolom (Col)</label><input type="number" id="lblCol" class="form-control" value="5" min="1" required></div>`;
      } else if (type === 'line') {
        title.innerText = "Tambah Batas Line Baru"; container.innerHTML = `<div class="form-group"><label>Nama Batas Line</label><input type="text" id="lineName" class="form-control" placeholder="Contoh: LINE D" required></div><div class="form-group"><label>Lebar (Jumlah Kolom)</label><input type="number" id="lineWidth" class="form-control" value="8" min="1" required></div><div class="form-group"><label>Tinggi (Jumlah Baris)</label><input type="number" id="lineHeight" class="form-control" value="12" min="1" required></div>`;
      }
      document.getElementById('nodeModal').classList.add('active');
    }

    function closeNodeModal() { document.getElementById('nodeModal').classList.remove('active'); }

    function submitNodeModal() {
      let id = activeModalType.charAt(0).toUpperCase() + '-' + Date.now();
      if (activeModalType === 'machine') {
        const name = document.getElementById('macName').value.trim();
        if (!name) return alert('Nama mesin tidak boleh kosong!'); mapData.machines.push({ id, name, row: 1, col: 1, status: 'OFF' });
      } else if (activeModalType === 'cqi') {
        const name = document.getElementById('cqiName').value.trim();
        if (!name) return alert('Nama CQI tidak boleh kosong!'); mapData.cqis.push({ id, name, row: 1, col: 1, status: 'OFF' });
      } else if (activeModalType === 'label') {
        const name = document.getElementById('lblName').value.trim();
        const row = parseInt(document.getElementById('lblRow').value) || 5; const col = parseInt(document.getElementById('lblCol').value) || 5;
        if (!name) return alert('Nama label tidak boleh kosong!'); mapData.labels.push({ id, name, row, col });
      } else if (activeModalType === 'line') {
        const name = document.getElementById('lineName').value.trim();
        const width = parseInt(document.getElementById('lineWidth').value) || 8; const height = parseInt(document.getElementById('lineHeight').value) || 12;
        if (!name) return alert('Nama Line tidak boleh kosong!');
        const palette = [{ border: '#a855f7', text: '#c084fc' }, { border: '#ec4899', text: '#f472b6' }, { border: '#14b8a6', text: '#2dd4bf' }];
        const style = palette[Math.floor(Math.random() * palette.length)];
        mapData.lines.push({ id: 'line-' + Date.now(), name, row: 1, col: 1, width, height, borderColor: style.border, textColor: style.text });
      }
      closeNodeModal(); renderGrid();
    }

    function toggleEditMode() { editMode = !editMode; document.body.className = editMode ? 'mode-edit' : 'mode-landing'; renderGrid(); }
    function toggleHeatmap() { showHeatmap = !showHeatmap; renderGrid(); }
    
    function exportMapJson() {
      let blob = new Blob([JSON.stringify(mapData, null, 2)], { type: "application/json" });
      let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "map.json"; a.click();
    }

    function goToConfig() {
      let runMachines = mapData.machines.filter(m => m.status === 'RUNNING');
      let readyCqis = mapData.cqis.filter(c => c.status === 'READY');
      if(runMachines.length === 0) { alert("Pilih minimal 1 mesin RUNNING!"); return; }
      if(readyCqis.length === 0) { alert("Pilih minimal 1 CQI READY!"); return; }

      // Simpan status On/Off mesin dan CQI ke Internal Storage (localStorage) sebelum berpindah halaman
      const currentStateToSave = {
        machines: mapData.machines.map(m => ({ id: m.id, name: m.name, status: m.status })),
        cqis: mapData.cqis.map(c => ({ id: c.id, name: c.name, status: c.status }))
      };
      localStorage.setItem('factory_internal_storage', JSON.stringify(currentStateToSave));

      sessionStorage.setItem('planning_state', JSON.stringify({ machines: runMachines, cqis: readyCqis }));
      window.location.href = 'config.html';
    }

    loadMap();
  </script>
</body>
