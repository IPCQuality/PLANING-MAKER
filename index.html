<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Factory Machine Map</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .marker {
      transition: transform 0.2s ease;
    }
    .marker:hover {
      transform: scale(1.3);
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <div class="container mx-auto px-4 py-6">
    <header class="flex justify-between items-center border-b border-gray-700 pb-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-blue-400">Digital Factory Machine Map</h1>
        <p class="text-sm text-gray-400">Mapping Mesin & Kalkulasi Alokasi Manpower</p>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 text-xs">
          <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span> RUNNING
          <span class="w-3 h-3 rounded-full bg-red-500 inline-block ml-2"></span> STOP
          <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block ml-2"></span> STANDBY
        </div>
        <a href="admin.html" class="bg-gray-800 hover:bg-gray-700 text-sm px-3 py-1.5 rounded border border-gray-600">Admin Panel</a>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 bg-gray-800 p-4 rounded-lg border border-gray-700">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-semibold text-gray-300">Layout Mesin Produksi</h2>
          <select id="layoutSelect" class="bg-gray-700 text-sm px-2 py-1 rounded border border-gray-600">
            <option value="images/layout_ab.png">LINE A & B</option>
            <option value="images/layout_c.png">LINE C</option>
          </select>
        </div>
        
        <div class="relative overflow-auto border border-gray-700 rounded bg-black" style="min-height: 500px;">
          <img id="layoutImage" src="images/layout_ab.png" alt="Factory Layout" class="w-full h-auto block" />
          <div id="markerOverlay" class="absolute inset-0"></div>
        </div>
      </div>

      <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 flex flex-col justify-between">
        <div>
          <h2 class="font-semibold text-gray-300 mb-4 border-b border-gray-700 pb-2">Sistem Pencarian Manpower</h2>
          
          <div class="mb-4">
            <label class="block text-sm text-gray-400 mb-1">Jumlah Manpower Hari Ini:</label>
            <div class="flex gap-2">
              <input type="number" id="inputMP" min="1" value="1" 
                     class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500" />
              <button onclick="calculateManpower()" 
                      class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded font-medium text-sm whitespace-nowrap">
                Hitung Rute
              </button>
            </div>
          </div>

          <div class="mt-4">
            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Output Alokasi Mesin:</h3>
            <div id="outputMP" class="bg-gray-950 p-4 rounded border border-gray-700 font-mono text-sm leading-relaxed max-h-96 overflow-y-auto text-green-400">
              Silakan masukkan jumlah MP dan klik "Hitung Rute".
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="machineModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">
    <div class="bg-gray-800 border border-gray-600 rounded-lg max-w-sm w-full p-6 relative">
      <button onclick="closeModal()" class="absolute top-3 right-4 text-gray-400 hover:text-white text-xl font-bold">&times;</button>
      <h3 class="text-lg font-bold text-blue-400 mb-4" id="modalName">-</h3>
      <div class="space-y-2 text-sm text-gray-300">
        <p><strong class="text-gray-400">TYPE:</strong> <span id="modalType">-</span></p>
        <p><strong class="text-gray-400">LINE:</strong> <span id="modalLine">-</span></p>
        <p><strong class="text-gray-400">AREA:</strong> <span id="modalArea">-</span></p>
        <p><strong class="text-gray-400">STATUS:</strong> <span id="modalStatus" class="font-semibold">-</span></p>
        <div class="pt-2 border-t border-gray-700">
          <strong class="text-gray-400 block mb-1">CQI AVAILABLE:</strong>
          <div id="modalCQI" class="text-yellow-400 font-mono">-</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let machinesData = [];
    const PIXEL_TO_METER_SCALE = 0.05; // Faktor konversi jarak piksel ke meter

    // Load Data JSON
    async function loadMachines() {
      try {
        const response = await fetch('data/mesin.json');
        machinesData = await response.json();
        renderMarkers();
      } catch (error) {
        console.error("Gagal memuat data mesin:", error);
        // Fallback data contoh jika diakses tanpa local server/fetch gagal
        machinesData = [
          { id: "AST45-61", nama_mesin: "AST45 61", tipe: "AST", line: "LINE A", area: "1A", x: 150, y: 180, status: "RUNNING", cqi: ["CQI01", "CQI02"] },
          { id: "ARP50P-24", nama_mesin: "ARP50P 24", tipe: "ARP", line: "LINE A", area: "2A", x: 220, y: 190, status: "RUNNING", cqi: ["CQI02"] },
          { id: "KH-01", nama_mesin: "KH01", tipe: "KANGHUI", line: "LINE B", area: "0B", x: 310, y: 240, status: "RUNNING", cqi: [] },
          { id: "X-03", nama_mesin: "XIANFEI 03", tipe: "XIANFEI", line: "LINE B", area: "1B", x: 400, y: 210, status: "STOP", cqi: [] },
          { id: "CH-01", nama_mesin: "CHUANGDA 1", tipe: "CHUANGDA", line: "LINE C", area: "1C", x: 180, y: 420, status: "RUNNING", cqi: ["CQI03"] },
          { id: "METICA-02", nama_mesin: "METICA 02", tipe: "METICA", line: "LINE C", area: "2C", x: 260, y: 450, status: "RUNNING", cqi: [] }
        ];
        renderMarkers();
      }
    }

    // Render Marker pada Peta
    function renderMarkers() {
      const overlay = document.getElementById('markerOverlay');
      overlay.innerHTML = '';

      machinesData.forEach(machine => {
        const marker = document.createElement('div');
        marker.className = 'marker absolute w-4 h-4 rounded-full border-2 border-white -translate-x-1/2 -translate-y-1/2';
        marker.style.left = `${machine.x}px`;
        marker.style.top = `${machine.y}px`;

        // Warna Berdasarkan Status
        if (machine.status === 'RUNNING') marker.classList.add('bg-green-500');
        else if (machine.status === 'STOP') marker.classList.add('bg-red-500');
        else marker.classList.add('bg-yellow-500');

        marker.addEventListener('click', () => showModal(machine));
        overlay.appendChild(marker);
      });
    }

    // Tampilkan Detail Modal
    function showModal(machine) {
      document.getElementById('modalName').textContent = machine.nama_mesin;
      document.getElementById('modalType').textContent = machine.tipe;
      document.getElementById('modalLine').textContent = machine.line;
      document.getElementById('modalArea').textContent = machine.area;
      
      const statusEl = document.getElementById('modalStatus');
      statusEl.textContent = machine.status;
      statusEl.className = machine.status === 'RUNNING' ? 'text-green-400 font-semibold' : 
                           machine.status === 'STOP' ? 'text-red-400 font-semibold' : 'text-yellow-400 font-semibold';

      const cqiContainer = document.getElementById('modalCQI');
      cqiContainer.innerHTML = (machine.cqi && machine.cqi.length > 0)
        ? machine.cqi.map(c => `<div>${c}</div>`).join('')
        : `<span class="text-gray-500">-</span>`;

      document.getElementById('machineModal').classList.replace('hidden', 'flex');
    }

    function closeModal() {
      document.getElementById('machineModal').classList.replace('flex', 'hidden');
    }

    // Hitung Jarak Euclidean
    function getDistance(x1, y1, x2, y2) {
      const dx = x1 - x2;
      const dy = y1 - y2;
      return Math.sqrt(dx * dx + dy * dy);
    }

    // Algoritma Nearest Neighbor (6 Mesin per MP)
    function calculateManpower() {
      const totalMP = parseInt(document.getElementById('inputMP').value) || 1;
      const outputEl = document.getElementById('outputMP');
      
      // 1. Filter hanya mesin berstatus RUNNING
      let availableMachines = machinesData.filter(m => m.status === 'RUNNING');

      // 2. Sort prioritas awal: Mesin dengan CQI aktif lebih diutamakan
      availableMachines.sort((a, b) => (b.cqi ? b.cqi.length : 0) - (a.cqi ? a.cqi.length : 0));

      let resultText = "";
      let currentX = 0;
      let currentY = 0; // Titik awal acuan pencarian

      for (let mp = 1; mp <= totalMP; mp++) {
        resultText += `MAN POWER : ${mp}\n`;
        resultText += `AREA CHECK:\n\n`;

        let assignedCount = 0;

        while (assignedCount < 6 && availableMachines.length > 0) {
          // Cari nearest neighbor dari currentX, currentY
          let nearestIndex = 0;
          let minDistance = Infinity;

          for (let i = 0; i < availableMachines.length; i++) {
            const dist = getDistance(currentX, currentY, availableMachines[i].x, availableMachines[i].y);
            if (dist < minDistance) {
              minDistance = dist;
              nearestIndex = i;
            }
          }

          const selectedMachine = availableMachines.splice(nearestIndex, 1)[0];
          const distanceMeter = Math.round(minDistance * PIXEL_TO_METER_SCALE);

          assignedCount++;
          resultText += `${assignedCount}.\n`;
          resultText += `${selectedMachine.nama_mesin}\n`;
          resultText += `${selectedMachine.line}\n`;
          resultText += `AREA ${selectedMachine.area}\n`;
          resultText += `Jarak ${distanceMeter < 1 ? 1 : distanceMeter} meter\n`;
          
          if (selectedMachine.cqi && selectedMachine.cqi.length > 0) {
            resultText += `CQI: ${selectedMachine.cqi.join(', ')}\n`;
          }
          resultText += `\n`;

          // Update titik acuan ke mesin yang baru saja dikunjungi
          currentX = selectedMachine.x;
          currentY = selectedMachine.y;
        }

        if (assignedCount === 0) {
          resultText += `(Tidak ada lagi mesin RUNNING yang tersedia)\n\n`;
        }

        resultText += `-------------------------\n\n`;
      }

      outputEl.textContent = resultText.trim();
    }

    document.getElementById('layoutSelect').addEventListener('change', (e) => {
      document.getElementById('layoutImage').src = e.target.value;
    });

    window.addEventListener('DOMContentLoaded', loadMachines);
  </script>
</body>
</html>
