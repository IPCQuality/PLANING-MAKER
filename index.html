<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MAP LIQUID 3 - Factory UI</title>
  <style>
    :root{
      --bg-main:#f0f4f8; --bg-panel:#ffffff; --border:#cbd5e1; --grid-line:#e2e8f0; --text-main:#1e293b; --text-muted:#64748b;
      --running:#16a34a; --setup:#d97706; --down:#dc2626; --offplan:#e2e8f0; --offplan-text:#64748b; --cqi-ready:#2563eb; --cqi-off:#cbd5e1;
      --shadow:0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    }
    *{box-sizing:border-box;margin:0;padding:0;user-select:none}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-main);color:var(--text-main);display:flex;flex-direction:column;height:100vh;overflow:hidden}

    header{background:var(--bg-panel);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:30;position:relative}
    .brand{font-weight:700;font-size:1.1rem;color:var(--cqi-ready);display:flex;align-items:center;gap:8px}
    .controls{display:flex;gap:8px;align-items:center}

    .btn{background:#f8fafc;color:var(--text-main);border:1px solid var(--border);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:500;display:inline-flex;align-items:center;gap:8px;width:100%;justify-content:flex-start}
    .btn:hover{background:#f1f5f9;border-color:#94a3b8}
    .btn-primary{background:var(--cqi-ready);color:white;border:1px solid transparent}
    .btn-primary:hover{background:#1d4ed8}
    .btn-success{background:var(--running);color:white;border:1px solid transparent}
    .btn-success:hover{background:#15803d}
    .btn-danger{background:var(--down);color:white;border:1px solid transparent}
    .btn-danger:hover{background:#b91c1c}

    .main-layout{display:flex;flex:1;overflow:hidden;position:relative}
    .side-panel{width:280px;flex-shrink:0;background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:margin-left .3s ease;z-index:20}
    .side-panel.closed{margin-left:-280px}

    .panel-toggle-btn{position:absolute;left:280px;top:50%;transform:translateY(-50%);width:24px;height:48px;background:white;border:1px solid var(--border);border-left:none;border-radius:0 8px 8px 0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:21}
    .side-panel.closed ~ .panel-toggle-btn{left:0}
    .panel-header{padding:12px 16px;border-bottom:1px solid var(--border);background:#f8fafc}
    .panel-header h3{font-size:.9rem;color:var(--text-main);margin:0;font-weight:600;text-align:center}
    .panel-body{padding:16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}

    .stats-box{background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:12px;font-size:.8rem;color:var(--text-muted);display:flex;flex-direction:column;gap:8px}
    .stat-line{display:flex;justify-content:space-between;align-items:center}
    .stat-val{font-weight:700;color:var(--text-main);background:#e2e8f0;padding:2px 6px;border-radius:4px}

    .ws-group{margin-bottom:8px}
    .ws-group-title{font-size:.75rem;color:var(--text-muted);margin-bottom:8px;font-weight:700;text-transform:uppercase;border-bottom:1px solid var(--grid-line);padding-bottom:4px}
    .ws-group-buttons{display:flex;flex-wrap:wrap;gap:6px}
    .ws-btn{background:#ffffff;color:var(--text-main);border:1px solid var(--border);padding:6px 8px;border-radius:4px;cursor:pointer;font-size:.75rem;font-weight:600;flex:1 1 calc(33% - 6px);text-align:center}

    .ws-btn.active-all{background:#dcfce7;color:#166534;border-color:#22c55e}
    .ws-btn.active-partial{background:#fef9c3;color:#854d0e;border-color:#eab308}

    .map-viewport{flex:1;overflow:auto;background:var(--bg-main);position:relative;cursor:default}
    .grid-wrapper{overflow:hidden;transform-origin:top left;padding:16px}
    .factory-grid{position:relative;display:grid;border:1px solid var(--border);background:white;transform-origin:top left;box-shadow:var(--shadow);width:max-content;height:max-content}

    .excel-header{background:#f8fafc;color:var(--text-muted);font-size:.75rem;font-weight:600;display:flex;align-items:center;justify-content:center;border:1px solid var(--grid-line)}
    .excel-corner{background:#f1f5f9}
    .grid-cell{border:1px solid var(--grid-line);min-width:78px;min-height:52px;display:flex;align-items:center;justify-content:center;position:relative;z-index:2}

    .line-box{position:relative;border:2px dashed #3b82f6;background:rgba(239,246,255,0.25);z-index:1;display:flex;flex-direction:column}
    .line-box .line-box-header{font-size:.75rem;font-weight:700;color:#60a5fa;background:#bfdbfe;padding:4px 8px;width:max-content}

    .node{width:94%;height:90%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.8rem;text-align:center;cursor:pointer;border-radius:6px;position:relative;transition:all 0.2s ease;}
    
    /* Efek Node Normal Sesuai Aslinya */
    .node-machine.OFF{background:var(--offplan);color:var(--offplan-text);border:1px solid var(--border)}
    .node-machine.RUNNING{background:var(--running);color:white;box-shadow:0 2px 8px rgba(22,163,74,0.4)}
    .node-cqi.OFF{background:var(--cqi-off);color:var(--text-muted);border:1px solid var(--border)}
    .node-cqi.READY{background:var(--cqi-ready);color:white;box-shadow:0 2px 8px rgba(37,99,235,0.4)}
    .node-label{background:#f8fafc;color:#475569;border:1px solid #cbd5e1;font-size:.8rem;font-weight:800;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,0.05)}

    .node-machine.planned{border:2px solid currentColor;box-shadow:0 0 0 3px white,0 0 14px rgba(37,99,235,0.55)}
    .node-cqi.planned-target{border:3px solid #0f172a;box-shadow:0 0 0 3px white,0 0 18px rgba(37,99,235,0.45)}

    .heatmap-badge{position:absolute;right:4px;top:4px;z-index:12;background:#1e293b;color:#fff;border-radius:4px;padding:1px 4px;font-size:9px;font-weight:800}

    .heatmap-legend{position:fixed;left:24px;bottom:24px;z-index:1001;background:rgba(255,255,255,0.96);border:1px solid var(--border);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);display:none}
    .heatmap-legend.active{display:block}
    .heatmap-legend-title{font-size:11px;font-weight:800;margin-bottom:7px}
    .heatmap-legend-row{display:flex;align-items:center;gap:7px;font-size:10px;margin:4px 0}
    .heatmap-dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,0.1)}

    .zoom-controls{position:fixed;bottom:30px;right:30px;display:flex;gap:8px;z-index:1000}
    .zoom-btn{background:white;border:1px solid var(--border);width:40px;height:40px;border-radius:8px;cursor:pointer;font-size:1.2rem;font-weight:bold;box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center}

    .toast-container{position:fixed;top:70px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:10px}
    .toast{background:white;border-left:4px solid var(--cqi-ready);box-shadow:var(--shadow);padding:12px 16px;border-radius:6px;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:8px}
    .toast.success{border-left-color:var(--running)}
  </style>
</head>
<body class="mode-landing">
  <header>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="brand">🏭 MAP LIQUID 3</div>
    </div>

    <!-- Tombol Heatmap disamping tombol Lanjut Konfigurasi -->
    <div class="controls">
      <button id="menuHeatmapBtn" class="btn" style="width:auto; border-color:var(--running); color:var(--running);">🔥 Heatmap</button>
      <button id="goConfigBtn" class="btn btn-primary control-landing" style="width:auto">Lanjut Konfigurasi ➔</button>
    </div>
  </header>

  <div class="toast-container" id="toastContainer"></div>

  <div class="main-layout">
    <div class="side-panel control-landing" id="sidePanel">
      <div class="panel-header"><h3>Filter & Status</h3></div>
      <div class="panel-body">
        <div style="display:flex;gap:8px">
          <button class="btn btn-success" style="flex:1;font-size:.75rem;justify-content:center" onclick="setAllMachinesRunning()">Run All</button>
          <button class="btn btn-danger" style="flex:1;font-size:.75rem;justify-content:center" onclick="setAllMachinesOff()">All Off</button>
        </div>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button class="btn btn-primary" style="flex:1;font-size:.75rem;justify-content:center" onclick="setAllCqiReady()">Ready All</button>
          <button class="btn btn-danger" style="flex:1;font-size:.75rem;justify-content:center" onclick="setAllCqiOff()">All Off</button>
        </div>

        <div class="stats-box">
          <div class="stat-line"><span>Mesin Running:</span> <span class="stat-val" id="statMachine">0 / 0</span></div>
          <div class="stat-line"><span>CQI Terpakai:</span> <span class="stat-val" id="statCqi">0 / 0</span></div>
        </div>
        <div id="wsBtnContainer"></div>
      </div>
    </div>

    <div class="panel-toggle-btn control-landing" onclick="toggleSidePanel()" id="panelToggleBtn">◀</div>

    <div class="map-viewport" id="mapViewport">
      <div class="grid-wrapper" id="gridWrapper">
        <div class="factory-grid" id="factoryGrid"></div>
      </div>
    </div>

    <div class="heatmap-legend" id="heatmapLegend">
      <div class="heatmap-legend-title">🔥 MANHATTAN ROUTE (WORKSTATION ENTRY)</div>
      <div class="heatmap-legend-row"><span class="heatmap-dot" style="background: conic-gradient(#ef4444, #f59e0b, #22c55e, #3b82f6, #a855f7, #ef4444);"></span><span>Setiap CQI memiliki warna unik pada garis rute</span></div>
      <div class="heatmap-legend-row"><span>Rute: Mesin ➔ (Label WS) ➔ (Checkpoint Lintas A/B/C) ➔ CQI</span></div>
      <div class="heatmap-legend-row"><span id="heatmapPlanInfo">Belum ada planning aktif</span></div>
    </div>

    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomOutBtn" onclick="zoomOut()" style="display:none">-</button>
      <button class="zoom-btn" id="zoomInBtn" onclick="zoomIn()">+</button>
    </div>
  </div>

  <script src="brain.js"></script>
  <script>
    const DEFAULT_LINES = [
      { id: 'line-a', name: 'LINE A', row: 2, col: 4, width: 24, height: 8, borderColor: '#3b82f6', textColor: '#60a5fa' },
      { id: 'line-b', name: 'LINE B', row: 11, col: 4, width: 27, height: 6, borderColor: '#3b82f6', textColor: '#60a5fa' },
      { id: 'line-c', name: 'LINE C', row: 13, col: 32, width: 22, height: 5, borderColor: '#3b82f6', textColor: '#60a5fa' },
      { id: 'line-ww', name: 'WW', row: 7, col: 32, width: 4, height: 4, borderColor: '#3b82f6', textColor: '#60a5fa' },
      { id: 'line-ot', name: 'OT', row: 2, col: 32, width: 4, height: 4, borderColor: '#3b82f6', textColor: '#60a5fa' }
    ];

    let mapData = { machines: [], cqis: [], labels: [], lines: [...DEFAULT_LINES] };
    let currentZoom = null, initialFitZoom = null, showHeatmap = false, activePlanning = null;

    const GRID_WIDTH = 4330, GRID_HEIGHT = 1068;
    const mapViewport = document.getElementById('mapViewport');

    function showToast(msg, type='info'){
      const container = document.getElementById('toastContainer');
      const t = document.createElement('div'); t.className = `toast ${type}`;
      t.innerHTML = `<span>${type==='success'?'✅':'ℹ️'}</span> ${msg}`; container.appendChild(t);
      setTimeout(()=>{ if(t.parentNode) t.remove(); }, 2500);
    }

    let isWheelTicking = false;
    mapViewport.addEventListener('wheel', function(e){
      if (e.deltaY === 0) return;
      e.preventDefault();
      if (!isWheelTicking) {
        window.requestAnimationFrame(() => {
          mapViewport.scrollLeft += e.deltaY;
          isWheelTicking = false;
        });
        isWheelTicking = true;
      }
    }, { passive: false });

    document.getElementById('menuHeatmapBtn').addEventListener('click', toggleHeatmap);
    document.getElementById('goConfigBtn').addEventListener('click', goToConfig);

    async function loadMap(){
      try{
        const res = await fetch('https://raw.githubusercontent.com/IPCQuality/PLANING-MAKER/refs/heads/main/data/map.json');
        if (!res.ok) throw new Error(); mapData = await res.json();
      }catch(e){
        try{ const resL = await fetch('map.json'); if (resL.ok) mapData = await resL.json(); }catch(err){}
      }
      mapData.machines = mapData.machines || [];
      mapData.cqis = mapData.cqis || [];
      mapData.labels = mapData.labels || [];
      mapData.lines = (mapData.lines && mapData.lines.length > 0) ? mapData.lines : [...DEFAULT_LINES];

      initializeStatuses(); renderWorkstationButtons(); applyZoom(true);
    }

    function initializeStatuses(){
      try{ 
        const raw = sessionStorage.getItem('active_planning'); 
        activePlanning = raw ? JSON.parse(raw) : null; 
        
        // AUTO-HEATMAP: Jika ada planning aktif (saat kembali dari config.html), heatmap otomatis aktif
        if (activePlanning) {
            showHeatmap = true;
        }
      }catch(e){}
      
      const saved = localStorage.getItem('factory_internal_storage');
      if (saved){
        try{
          const parsed = JSON.parse(saved);
          if (parsed.machines) parsed.machines.forEach(sm=>{ let m = mapData.machines.find(x=>x.id===sm.id); if(m) m.status = sm.status; });
          if (parsed.cqis) parsed.cqis.forEach(sc=>{ let c = mapData.cqis.find(x=>x.id===sc.id); if(c) c.status = sc.status; });
        }catch(e){}
      } else {
        mapData.machines.forEach(m=>m.status = m.status === 'RUNNING' ? 'RUNNING' : 'OFF');
        mapData.cqis.forEach(c=>c.status = c.status === 'READY' ? 'READY' : 'OFF');
      }
      renderGrid();
    }

    function renderWorkstationButtons(){
      const container = document.getElementById('wsBtnContainer'); if(!container) return; container.innerHTML = '';
      const groups = [
        { title: "LINE A", keys: ["0A","1A","2A","3A","4A","5A","6A","7A","8A","9A","10A"] },
        { title: "LINE B", keys: ["0B","1B","2B","3B","4B","5B","6B","7B","8B","9B","10B","11B"] },
        { title: "LINE C", keys: ["1C","2C","3C","4C","5C","6C","7C","8C","9C","10C"] }
      ];
      groups.forEach(g=>{
        let box = document.createElement('div'); box.className = 'ws-group';
        box.innerHTML = `<div class="ws-group-title">${g.title}</div>`;
        let btns = document.createElement('div'); btns.className = 'ws-group-buttons';
        g.keys.forEach(k=>{
          let b = document.createElement('button'); b.className = 'ws-btn'; b.innerText = k; b.id = 'ws-btn-' + k;
          b.onclick = ()=>toggleWorkstation(k); btns.appendChild(b);
        });
        box.appendChild(btns); container.appendChild(box);
      });
      updateStatsAndButtons();
    }

    function updateStatsAndButtons(){
      document.getElementById('statMachine').innerText = `${mapData.machines.filter(m=>m.status==='RUNNING').length} / ${mapData.machines.length}`;
      document.getElementById('statCqi').innerText = `${mapData.cqis.filter(c=>c.status==='READY').length} / ${mapData.cqis.length}`;
      if (typeof WORKSTATIONS === 'undefined') return;
      for (let k in WORKSTATIONS){
        let b = document.getElementById('ws-btn-' + k); if(!b) continue;
        let macs = mapData.machines.filter(m => WORKSTATIONS[k].some(x => BrainAI.normalizeName(m.name) === BrainAI.normalizeName(x)));
        if (macs.length === 0) { b.className = 'ws-btn'; continue; }
        if (macs.every(m => m.status === 'RUNNING')) b.className = 'ws-btn active-all';
        else if (macs.some(m => m.status === 'RUNNING')) b.className = 'ws-btn active-partial';
        else b.className = 'ws-btn';
      }
    }

    function toggleWorkstation(wsKey){
      if (typeof WORKSTATIONS === 'undefined' || !WORKSTATIONS[wsKey]) return;
      let macs = mapData.machines.filter(m => WORKSTATIONS[wsKey].some(x => BrainAI.normalizeName(m.name) === BrainAI.normalizeName(x)));
      let tgt = macs.every(m => m.status === 'RUNNING') ? 'OFF' : 'RUNNING';
      macs.forEach(m=>m.status = tgt); renderGrid();
    }

    function toggleSidePanel(){ const p = document.getElementById('sidePanel'); p.classList.toggle('closed'); document.getElementById('panelToggleBtn').innerText = p.classList.contains('closed') ? '▶' : '◀'; setTimeout(()=>applyZoom(false),310); }

    function renderGrid(){
      const grid = document.getElementById('factoryGrid');
      grid.innerHTML = '';

      const fragment = document.createDocumentFragment();
      let totalCols = 55, totalRows = 20;

      grid.style.gridTemplateColumns = `40px repeat(${totalCols}, 78px)`;
      grid.style.gridTemplateRows = `28px repeat(${totalRows}, 52px)`;

      const cellMap = {};

      let corner = document.createElement('div'); corner.className = 'excel-header excel-corner'; corner.innerText = 'R\\C';
      corner.style.gridRow = '1'; corner.style.gridColumn = '1'; fragment.appendChild(corner);

      for (let c=1;c<=totalCols;c++){
        let h = document.createElement('div'); h.className = 'excel-header'; h.innerText = getColLetter(c);
        h.style.gridRow = '1'; h.style.gridColumn = `${c+1}`; fragment.appendChild(h);
      }
      for (let r=1;r<=totalRows;r++){
        let h = document.createElement('div'); h.className = 'excel-header'; h.innerText = r;
        h.style.gridRow = `${r+1}`; h.style.gridColumn = '1'; fragment.appendChild(h);
        for (let c=1;c<=totalCols;c++){
          let cell = document.createElement('div'); cell.className = 'grid-cell'; cell.dataset.row = r; cell.dataset.col = c;
          cell.style.gridRow = `${r+1}`; cell.style.gridColumn = `${c+1}`;
          cellMap[`${r}-${c}`] = cell;
          fragment.appendChild(cell);
        }
      }

      if (Array.isArray(mapData.lines)){
        mapData.lines.forEach(line=>{
          let lEl = document.createElement('div'); lEl.className = 'line-box'; lEl.id = line.id;
          const row = Math.max(1, Math.min(1000, (line.row||1)));
          const col = Math.max(1, Math.min(1000, (line.col||1)));
          const width = Math.max(1, Math.min(1000, (line.width||1)));
          const height = Math.max(1, Math.min(1000, (line.height||1)));

          lEl.style.gridRow = `${row + 1} / span ${height}`; lEl.style.gridColumn = `${col + 1} / span ${width}`;
          if (line.borderColor) lEl.style.borderColor = line.borderColor;

          let headerStyle = line.textColor ? `style="color:${line.textColor}"` : '';
          lEl.innerHTML = `<div class="line-box-header" ${headerStyle}>${line.name}</div>`;
          lEl.style.pointerEvents = 'none';

          fragment.appendChild(lEl);
        });
      }

      const assignments = new Map();
      const plannedCqiIds = new Set();

      const cqiColors = [
        '#e11d48', '#d97706', '#65a30d', '#059669', '#0891b2', '#0284c7',
        '#4f46e5', '#7c3aed', '#c026d3', '#be123c', '#b45309', '#4d7c0f',
        '#047857', '#0f766e', '#0369a1', '#4338ca', '#6d28d9', '#a21caf',
        '#9f1239', '#ea580c'
      ];
      let cqiColorMap = {};

      if (activePlanning && Array.isArray(activePlanning.slots)){
        activePlanning.slots.forEach((s, idx) => {
          if (s && s.cqi && s.machines) {
            cqiColorMap[s.cqi.id] = cqiColors[idx % cqiColors.length];
            s.machines.forEach(m => assignments.set(String(m.id || m.name).trim(), s.cqi));
            if (s.machines.length > 0) plannedCqiIds.add(s.cqi.id);
          }
        });
      }

      const appendNode = (node,type) => {
        let cell = cellMap[`${node.row}-${node.col}`];
        if (!cell) return;
        let div = document.createElement('div'); div.className = `node node-${type} ${node.status || ''}`;
        div.id = node.id; div.innerHTML = `<span>${node.name}</span>`;

        // Logic Styling Saat Heatmap (Tampilan dikembalikan seperti normal tanpa warna modifikasi berlebihan)
        if (type === 'machine') {
            let planCqi = assignments.get(String(node.id || node.name).trim());
            if (planCqi) {
                div.classList.add('planned');
                if (showHeatmap) {
                    // Hanya tambahkan badge kecil untuk penanda target
                    div.innerHTML += `<span class="heatmap-badge" style="background:#1e293b; color:#fff;">${planCqi.name}</span>`;
                }
            }
        } else if (type === 'cqi') {
            if (plannedCqiIds.has(node.id)) {
                div.classList.add('planned-target');
            }
        }

        if (type === 'machine' || type === 'cqi') div.onclick = () => cycleStatus(node,type);
        cell.appendChild(div);
      };

      mapData.machines.forEach(m=>appendNode(m,'machine'));
      mapData.cqis.forEach(c=>appendNode(c,'cqi'));
      mapData.labels.forEach(l=>appendNode(l,'label'));

      if (showHeatmap && assignments.size > 0){
        const svgNS = "http://www.w3.org/2000/svg"; let svg = document.createElementNS(svgNS,"svg");
        svg.style.position = "absolute"; svg.style.top = "0"; svg.style.left = "0"; svg.style.width = "100%"; svg.style.height = "100%"; svg.style.pointerEvents = "none"; svg.style.zIndex = "8";
        const getCenter = (n) => ({ x: 40 + (n.col - 1) * 78 + 39, y: 28 + (n.row - 1) * 52 + 26 });

        assignments.forEach((cqiTarget, mId)=>{
          let mac = mapData.machines.find(x => String(x.id || x.name).trim() === mId);
          if (!mac || mac.status !== 'RUNNING') return;
          let tgt = mapData.cqis.find(x => String(x.id || x.name).trim() === String(cqiTarget.id || cqiTarget.name).trim());
          if (!tgt) return;

          let wsKey = BrainAI.getWorkstationKey(mac.name || mac.id);
          let wl = mapData.labels.find(l => BrainAI.normalizeName(l.name) === BrainAI.normalizeName(wsKey));
          let pathColor = cqiColorMap[tgt.id] || '#16a34a';

          let cqiMatch = String(tgt.name || tgt.id).match(/\d+/);
          let cqiNum = cqiMatch ? cqiMatch[0] : null;
          let isWWorOT = (cqiNum === '24' || cqiNum === '19' || wsKey === 'WW' || wsKey === 'OT');

          let mZone = (mac.col >= 32 || (wsKey && wsKey.endsWith('C'))) ? 'C' : 'AB';
          let cZone = (tgt.col >= 32) ? 'C' : 'AB';

          let p1 = getCenter(mac);
          let pEnd = getCenter(tgt);
          
          let pCP1 = getCenter({row: 10, col: 31});
          let pCP2 = getCenter({row: 12, col: 31});

          let routePoints = [p1];
          if (wl) routePoints.push(getCenter(wl));

          if (!isWWorOT && mZone === 'AB' && cZone === 'C') {
              routePoints.push(pCP1, pCP2);
          } else if (!isWWorOT && mZone === 'C' && cZone === 'AB') {
              routePoints.push(pCP2, pCP1);
          }

          routePoints.push(pEnd);

          // Path builder garis lurus siku-siku bertabrakan/tumpang tindih
          let dPath = `M ${routePoints[0].x} ${routePoints[0].y}`;
          
          for (let i = 1; i < routePoints.length; i++) {
              let prev = routePoints[i - 1];
              let curr = routePoints[i];
              dPath += ` L ${curr.x} ${prev.y} L ${curr.x} ${curr.y}`;
          }

          let path = document.createElementNS(svgNS, "path");
          path.setAttribute("d", dPath); 
          path.setAttribute("fill", "none"); 
          path.setAttribute("stroke", pathColor);
          
          // Garis tipis solid warna
          path.setAttribute("stroke-width", "2"); 
          path.setAttribute("stroke-linejoin", "round");
          
          svg.appendChild(path);
        });
        fragment.appendChild(svg);
      }

      grid.appendChild(fragment);
      updateStatsAndButtons();
    }

    function applyZoom(init=false){
      let mx = mapViewport.clientWidth / GRID_WIDTH, my = mapViewport.clientHeight / GRID_HEIGHT;
      let fitZoom = Math.max(mx, my);

      if (!isFinite(fitZoom) || fitZoom <= 0) fitZoom = 0.1;
      if (init || currentZoom === null) {
        currentZoom = fitZoom;
        initialFitZoom = fitZoom;
      }
      currentZoom = Math.max(0.1, Math.min(3, currentZoom));

      document.getElementById('factoryGrid').style.transform = `scale(${currentZoom})`;
      document.getElementById('gridWrapper').style.width = `${GRID_WIDTH * currentZoom}px`;
      document.getElementById('gridWrapper').style.height = `${GRID_HEIGHT * currentZoom}px`;

      updateZoomButtons();
    }

    function updateZoomButtons(){
      const outBtn = document.getElementById('zoomOutBtn');
      if (!outBtn) return;
      if (initialFitZoom !== null && currentZoom > initialFitZoom + 0.01) {
        outBtn.style.display = 'inline-flex';
      } else {
        outBtn.style.display = 'none';
      }
    }

    function zoomIn(){ currentZoom = (currentZoom || 1) + 0.1; applyZoom(); }
    function zoomOut(){ currentZoom = (currentZoom || 1) - 0.1; applyZoom(); }

    function cycleStatus(node,type){ const arr = type === 'machine' ? ['OFF','RUNNING'] : ['OFF','READY']; node.status = arr[(arr.indexOf(node.status)+1)%arr.length]; renderGrid(); }

    function setAllMachinesRunning(){ mapData.machines.forEach(m=>m.status='RUNNING'); renderGrid(); }
    function setAllMachinesOff(){ mapData.machines.forEach(m=>m.status='OFF'); renderGrid(); }
    function setAllCqiReady(){ mapData.cqis.forEach(c=>c.status='READY'); renderGrid(); }
    function setAllCqiOff(){ mapData.cqis.forEach(c=>c.status='OFF'); renderGrid(); }

    function toggleHeatmap(){ if(!activePlanning){ showToast("Tidak ada plan aktif!", "error"); return; } showHeatmap = !showHeatmap; renderGrid(); }

    function goToConfig(){
      let runM = mapData.machines.filter(m=>m.status==='RUNNING');
      let rdyC = mapData.cqis.filter(c=>c.status==='READY');
      if (runM.length===0 || rdyC.length===0){ showToast("Pastikan ada mesin RUNNING & CQI READY!", "error"); return; }
      localStorage.setItem('factory_internal_storage', JSON.stringify({ machines: mapData.machines, cqis: mapData.cqis }));
      sessionStorage.setItem('planning_state', JSON.stringify({ machines: runM, cqis: rdyC, labels: mapData.labels }));
      window.location.href = 'config.html';
    }

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => applyZoom(), 150);
    });

    loadMap();

    function getColLetter(col){
      let letter = '';
      while (col > 0){ let rem = (col - 1) % 26; letter = String.fromCharCode(65 + rem) + letter; col = Math.floor((col - 1) / 26); }
      return letter;
    }
  </script>
</body>
