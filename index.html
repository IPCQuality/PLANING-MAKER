<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MAP LIQUID 3 - Factory UI</title>
  <style>
    :root{
      --bg-main:#f0f4f8; --bg-panel:#ffffff; --border:#cbd5e1; --grid-line:#e2e8f0; --text-main:#1e293b; --text-muted:#64748b;
      --running:#16a34a; --setup:#d97706; --down:#dc2626; --offplan:#e2e8f0; --offplan-text:#64748b; --cqi-ready:#2563eb; --cqi-off:#cbd5e1;
      --shadow:0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    }
    *{box-sizing:border-box;margin:0;padding:0;user-select:none}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-main);color:var(--text-main);display:flex;flex-direction:column;height:100vh;overflow:hidden}

    header{background:var(--bg-panel);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:30;position:relative}
    .brand{font-weight:700;font-size:1.1rem;color:var(--cqi-ready);display:flex;align-items:center;gap:8px}
    .controls{display:flex;gap:12px;align-items:center}

    .btn{background:#f8fafc;color:var(--text-main);border:1px solid var(--border);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
    .btn:hover{background:#f1f5f9;border-color:#94a3b8}
    .btn-primary{background:var(--cqi-ready);color:white;border:1px solid transparent}
    .btn-primary:hover{background:#1d4ed8}
    .btn-success{background:var(--running);color:white;border:1px solid transparent}
    .btn-success:hover{background:#15803d}
    .btn-danger{background:var(--down);color:white;border:1px solid transparent}
    .btn-danger:hover{background:#b91c1c}

    .main-layout{display:flex;flex:1;overflow:hidden;position:relative}
    .side-panel{width:280px;flex-shrink:0;background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:margin-left .3s ease;z-index:20}
    .side-panel.closed{margin-left:-280px}

    .panel-toggle-btn{position:absolute;left:280px;top:50%;transform:translateY(-50%);width:24px;height:48px;background:white;border:1px solid var(--border);border-left:none;border-radius:0 8px 8px 0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:21}
    .side-panel.closed ~ .panel-toggle-btn{left:0}
    .panel-header{padding:12px 16px;border-bottom:1px solid var(--border);background:#f8fafc}
    .panel-header h3{font-size:.9rem;color:var(--text-main);margin:0;font-weight:600;text-align:center}
    .panel-body{padding:16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}

    .stats-box{background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:12px;font-size:.8rem;color:var(--text-muted);display:flex;flex-direction:column;gap:8px}
    .stat-line{display:flex;justify-content:space-between;align-items:center}
    .stat-val{font-weight:700;color:var(--text-main);background:#e2e8f0;padding:2px 6px;border-radius:4px}

    .ws-group{margin-bottom:8px}
    .ws-group-title{font-size:.75rem;color:var(--text-muted);margin-bottom:8px;font-weight:700;text-transform:uppercase;border-bottom:1px solid var(--grid-line);padding-bottom:4px}
    .ws-group-buttons{display:flex;flex-wrap:wrap;gap:6px}
    .ws-btn{background:#ffffff;color:var(--text-main);border:1px solid var(--border);padding:6px 8px;border-radius:4px;cursor:pointer;font-size:.75rem;font-weight:600;flex:1 1 calc(33% - 6px);text-align:center}
    .ws-btn.active-all{background:#dcfce7;color:#166534;border-color:#22c55e}
    .ws-btn.active-partial{background:#fef9c3;color:#854d0e;border-color:#eab308}

    .map-viewport{flex:1;overflow:auto;background:var(--bg-main);position:relative;cursor:default}
    .grid-wrapper{overflow:hidden;transform-origin:top left;padding:16px}
    .factory-grid{position:relative;display:grid;border:1px solid var(--border);background:white;transform-origin:top left;box-shadow:var(--shadow);width:max-content;height:max-content;transition:padding 0.3s}

    .excel-header{background:#f8fafc;color:var(--text-muted);font-size:.75rem;font-weight:600;display:flex;align-items:center;justify-content:center;border:1px solid var(--grid-line)}
    .excel-corner{background:#f1f5f9}
    .grid-cell{border:1px solid var(--grid-line);min-width:78px;min-height:52px;display:flex;align-items:center;justify-content:center;position:relative;z-index:2}
    .grid-cell.drag-over{background:rgba(37,99,235,0.1);border:2px dashed var(--cqi-ready)}

    .line-box{position:relative;border:2px dashed #3b82f6;background:rgba(239,246,255,0.25);z-index:1;display:flex;flex-direction:column}
    .line-box .line-box-header{font-size:.75rem;font-weight:700;color:#60a5fa;background:#bfdbfe;padding:4px 8px;width:max-content}

    .node{width:94%;height:90%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.8rem;text-align:center;cursor:pointer;border-radius:6px;position:relative}
    .node-machine.OFF{background:var(--offplan);color:var(--offplan-text);border:1px solid var(--border)}
    .node-machine.RUNNING{background:var(--running);color:white;box-shadow:0 2px 8px rgba(22,163,74,0.4)}
    .node-cqi.OFF{background:var(--cqi-off);color:var(--text-muted);border:1px solid var(--border)}
    .node-cqi.READY{background:var(--cqi-ready);color:white;box-shadow:0 2px 8px rgba(37,99,235,0.4)}
    .node-label{background:#f8fafc;color:#475569;border:1px solid #cbd5e1;font-size:.8rem;font-weight:800;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,0.05)}

    .node-machine.planned{border:2px solid currentColor;box-shadow:0 0 0 3px white,0 0 14px rgba(37,99,235,0.55)}
    .node-cqi.planned-target{border:3px solid #0f172a;box-shadow:0 0 0 3px white,0 0 18px rgba(37,99,235,0.45)}
    .heatmap-badge{position:absolute;right:4px;top:4px;z-index:12;background:#1e293b;color:#fff;border-radius:4px;padding:1px 4px;font-size:9px;font-weight:800}

    .heatmap-legend{position:fixed;left:24px;bottom:24px;z-index:1001;background:rgba(255,255,255,0.96);border:1px solid var(--border);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);display:none}
    .heatmap-legend.active{display:block}
    .heatmap-legend-title{font-size:11px;font-weight:800;margin-bottom:7px}
    .heatmap-legend-row{display:flex;align-items:center;gap:7px;font-size:10px;margin:4px 0}
    .heatmap-dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,0.1)}

    .zoom-controls{position:fixed;bottom:30px;right:30px;display:flex;gap:8px;z-index:1000}
    .zoom-btn{background:white;border:1px solid var(--border);width:40px;height:40px;border-radius:8px;cursor:pointer;font-size:1.2rem;font-weight:bold;box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center}

    .toast-container{position:fixed;top:70px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:10px}
    .toast{background:white;border-left:4px solid var(--cqi-ready);box-shadow:var(--shadow);padding:12px 16px;border-radius:6px;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:8px}
    .toast.success{border-left-color:var(--running)}

    body.mode-edit .node { cursor: grab; }
    body.mode-edit .node:active { cursor: grabbing; }
    body.mode-edit .factory-grid { padding: 0 100px 100px 0; background:#f8fafc; }
    body.mode-edit .line-box { pointer-events: auto; cursor: pointer; transition: 0.2s; }
    body.mode-edit .line-box:hover { background: rgba(59, 130, 246, 0.4); border-style: solid; }
    
    .del-btn { position:absolute; top:-8px; right:-8px; background:#ef4444; color:white; border-radius:50%; width:20px; height:20px; font-size:10px; line-height:20px; text-align:center; cursor:pointer; display:none; z-index:15; border: 1px solid white;}
    body.mode-edit .del-btn { display:block; }
    
    .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.5);display:flex;align-items:center;justify-content:center;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s ease}
    .modal-overlay.active{opacity:1;pointer-events:auto}
    .modal-card{background:white;border-radius:12px;width:380px;padding:24px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);}
    .modal-card h3{margin-bottom:16px;color:var(--text-main);font-size:1.1rem;border-bottom:1px solid var(--grid-line);padding-bottom:8px;}
    
    .menu-list{display:flex;flex-direction:column;gap:10px;}
    .menu-list .btn { justify-content: flex-start; padding: 10px 14px; }
    
    .form-group{margin-bottom:12px;display:flex;flex-direction:column;gap:6px;}
    .form-group label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
    .form-control{border:1px solid var(--border);padding:8px 12px;border-radius:6px;outline:none;font-size:0.9rem;}
    .form-control:focus { border-color: var(--cqi-ready); }
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
  </style>
</head>
<body class="mode-landing">
  <header>
    <div class="brand">🏭 MAP LIQUID 3</div>
    <div class="controls">
      <button id="settingsBtn" class="btn" onclick="handleSettingsClick()">⚙️ Setelan</button>
      <button id="menuHeatmapBtn" class="btn btn-danger control-landing" onclick="toggleHeatmap()">🔥 Heatmap OFF</button>
      <button id="goConfigBtn" class="btn btn-primary control-landing" onclick="goToConfig()">Lanjut Konfigurasi ➔</button>
    </div>
  </header>

  <div class="toast-container" id="toastContainer"></div>

  <div class="main-layout">
    <div class="side-panel control-landing" id="sidePanel">
      <div class="panel-header"><h3>Filter & Status</h3></div>
      <div class="panel-body">
        <div style="display:flex;gap:8px">
          <button class="btn btn-success" style="flex:1;font-size:.75rem;" onclick="setAllMachinesRunning()">Run All</button>
          <button class="btn btn-danger" style="flex:1;font-size:.75rem;" onclick="setAllMachinesOff()">All Off</button>
        </div>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button class="btn btn-primary" style="flex:1;font-size:.75rem;" onclick="setAllCqiReady()">Ready All</button>
          <button class="btn btn-danger" style="flex:1;font-size:.75rem;" onclick="setAllCqiOff()">All Off</button>
        </div>

        <div class="stats-box">
          <div class="stat-line"><span>Mesin Running:</span> <span class="stat-val" id="statMachine">0 / 0</span></div>
          <div class="stat-line"><span>CQI Terpakai:</span> <span class="stat-val" id="statCqi">0 / 0</span></div>
        </div>

        <div id="wsBtnContainer"></div>
      </div>
    </div>

    <div class="panel-toggle-btn control-landing" onclick="toggleSidePanel()" id="panelToggleBtn">◀</div>

    <div class="map-viewport" id="mapViewport">
      <div class="grid-wrapper" id="gridWrapper">
        <div class="factory-grid" id="factoryGrid"></div>
      </div>
    </div>

    <div class="heatmap-legend" id="heatmapLegend">
      <div class="heatmap-legend-title">🔥 MANHATTAN ROUTE (WORKSTATION ENTRY)</div>
      <div class="heatmap-legend-row"><span class="heatmap-dot" style="background: conic-gradient(#ef4444, #f59e0b, #22c55e, #3b82f6, #a855f7, #ef4444);"></span><span>Setiap CQI memiliki warna unik (Mesin, Garis & CQI)</span></div>
      <div class="heatmap-legend-row"><span>Rute: Mesin ➔ (Label WS) ➔ (Checkpoint Lintas A/B/C) ➔ CQI</span></div>
    </div>

    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomOutBtn" onclick="zoomOut()" style="display:none">-</button>
      <button class="zoom-btn" id="zoomInBtn" onclick="zoomIn()">+</button>
    </div>
  </div>

  <!-- MODAL PENGATURAN -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <h3>Pengaturan Map</h3>
      <div class="menu-list">
         <button class="btn" onclick="activateEditMode()">✏️ Edit Map</button>
         <button class="btn" onclick="openNodeModal('machine')">➕ Tambah Mesin</button>
         <button class="btn" onclick="openNodeModal('cqi')">➕ Tambah CQI</button>
         <button class="btn" onclick="openNodeModal('label')">➕ Tambah Label</button>
         <button class="btn" onclick="openNodeModal('line')">🔲 Tambah Batas Line</button>
         <button class="btn btn-success" onclick="exportMapJson()">💾 Save map.json</button>
      </div>
      <div class="modal-actions">
         <button class="btn" onclick="closeSettingsModal()">Tutup</button>
      </div>
    </div>
  </div>

  <!-- MODAL EDITOR NODE -->
  <div class="modal-overlay" id="nodeModal">
    <div class="modal-card">
      <h3 id="modalTitle">Kustomisasi Object</h3>
      <div id="modalFormContainer"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeNodeModal()">Batal</button>
        <button id="modalSaveBtn" class="btn btn-primary" onclick="submitNodeModal()">Simpan</button>
      </div>
    </div>
  </div>

  <script src="brain.js"></script>
  <script>
    let mapData = { machines: [], cqis: [], labels: [], lines: [] };
    let currentZoom = null, initialFitZoom = null, showHeatmap = false, activePlanning = null;
    let editMode = false, draggedNode = null;
    let activeModalType = null, editingNodeId = null;
    let totalCols = 55, totalRows = 20;

    const mapViewport = document.getElementById('mapViewport');

    function showToast(msg, type='info'){
      const container = document.getElementById('toastContainer');
      const t = document.createElement('div'); t.className = `toast ${type}`;
      t.innerHTML = `<span>${type==='success'?'✅':'ℹ️'}</span> ${msg}`; 
      container.appendChild(t);
      setTimeout(()=> { if(t.parentNode) t.remove(); }, 2500);
    }

    let isWheelTicking = false;
    mapViewport.addEventListener('wheel', function(e){
      if (e.deltaY === 0) return;
      e.preventDefault();
      if (!isWheelTicking) {
        window.requestAnimationFrame(() => {
          mapViewport.scrollLeft += e.deltaY;
          isWheelTicking = false;
        });
        isWheelTicking = true;
      }
    }, { passive: false });

    async function loadMap(){
      try{
        const res = await fetch('https://raw.githubusercontent.com/IPCQuality/PLANING-MAKER/refs/heads/main/data/map.json');
        if (!res.ok) throw new Error(); 
        mapData = await res.json();
      } catch(e) {
        try { 
            const resL = await fetch('map.json'); 
            if (resL.ok) mapData = await resL.json(); 
        } catch(err) {}
      }

      const normalizeNode = (n) => {
        if (n.position) { n.row = n.position.row; n.col = n.position.col; }
        return n;
      };
      mapData.machines = (mapData.machines || []).map(normalizeNode);
      mapData.cqis = (mapData.cqis || []).map(normalizeNode);
      mapData.labels = (mapData.labels || []).map(normalizeNode);
      mapData.lines = mapData.lines || [];

      calculateGridBounds();
      initializeStatuses(); 
      renderWorkstationButtons();
      applyZoom(true);
    }

    function calculateGridBounds() {
      let maxR = 20, maxC = 55;
      const checkMax = (r, c) => { if(r > maxR) maxR = r; if(c > maxC) maxC = c; };
      
      mapData.machines.forEach(n => checkMax(n.row, n.col));
      mapData.cqis.forEach(n => checkMax(n.row, n.col));
      mapData.labels.forEach(n => checkMax(n.row, n.col));
      mapData.lines.forEach(l => checkMax((l.row || 1) + (l.height || 1) - 1, (l.col || 1) + (l.width || 1) - 1));

      let buffer = editMode ? 10 : 2;
      totalRows = maxR + buffer; 
      totalCols = maxC + buffer; 
    }

    function initializeStatuses(){
      try{ 
          const raw = sessionStorage.getItem('active_planning'); 
          activePlanning = raw ? JSON.parse(raw) : null; 
      }catch(e){}

      const saved = localStorage.getItem('factory_internal_storage');
      if (saved){
        try{
          const parsed = JSON.parse(saved);
          if (parsed.machines) parsed.machines.forEach(sm=>{ let m = mapData.machines.find(x=>x.id===sm.id); if(m) m.status = sm.status; });
          if (parsed.cqis) parsed.cqis.forEach(sc=>{ let c = mapData.cqis.find(x=>x.id===sc.id); if(c) c.status = sc.status; });
        }catch(e){}
      } else {
        mapData.machines.forEach(m=>m.status = m.status === 'RUNNING' ? 'RUNNING' : 'OFF');
        mapData.cqis.forEach(c=>c.status = c.status === 'READY' ? 'READY' : 'OFF');
      }

      if (activePlanning && Array.isArray(activePlanning.slots)) {
          showHeatmap = true;
          document.getElementById('menuHeatmapBtn').innerText = '🔥 Heatmap ON';
          document.getElementById('menuHeatmapBtn').className = 'btn btn-success';
          document.getElementById('heatmapLegend').classList.add('active');
      }

      renderGrid();
    }

    function renderWorkstationButtons(){
      const container = document.getElementById('wsBtnContainer'); 
      if(!container) return; 
      container.innerHTML = '';

      const groups = [
        { title: "LINE A", keys: ["0A","1A","2A","3A","4A","5A","6A","7A","8A","9A","10A"] },
        { title: "LINE B", keys: ["0B","1B","2B","3B","4B","5B","6B","7B","8B","9B","10B","11B"] },
        { title: "LINE C", keys: ["1C","2C","3C","4C","5C","6C","7C","8C","9C","10C"] },
        { title: "LAINNYA", keys: ["WW","OT"] }
      ];

      groups.forEach(g=>{
        let box = document.createElement('div'); box.className = 'ws-group';
        box.innerHTML = `<div class="ws-group-title">${g.title}</div>`;
        let btns = document.createElement('div'); btns.className = 'ws-group-buttons';
        g.keys.forEach(k=>{
          let b = document.createElement('button'); b.className = 'ws-btn'; b.innerText = k; b.id = 'ws-btn-' + k;
          b.onclick = ()=>toggleWorkstation(k); btns.appendChild(b);
        });
        box.appendChild(btns); container.appendChild(box);
      });
      updateStatsAndButtons();
    }

    // PERBAIKAN 1: updateStatsAndButtons kini menggunakan BrainAI.getWorkstationKey (karena BrainAI.WORKSTATIONS telah dihapus)
    function updateStatsAndButtons(){
      document.getElementById('statMachine').innerText = `${mapData.machines.filter(m=>m.status==='RUNNING').length} / ${mapData.machines.length}`;
      document.getElementById('statCqi').innerText = `${mapData.cqis.filter(c=>c.status==='READY').length} / ${mapData.cqis.length}`;
      
      if (typeof BrainAI === 'undefined') return;

      const wsKeys = ["0A","1A","2A","3A","4A","5A","6A","7A","8A","9A","10A", "0B","1B","2B","3B","4B","5B","6B","7B","8B","9B","10B","11B", "1C","2C","3C","4C","5C","6C","7C","8C","9C","10C", "WW","OT"];
      
      for (let k of wsKeys){
        let b = document.getElementById('ws-btn-' + k); if(!b) continue;
        
        let macs = mapData.machines.filter(m => BrainAI.getWorkstationKey(m.name, mapData.labels) === k);
        if (macs.length === 0) { b.className = 'ws-btn'; continue; }
        
        if (macs.every(m => m.status === 'RUNNING')) b.className = 'ws-btn active-all';
        else if (macs.some(m => m.status === 'RUNNING')) b.className = 'ws-btn active-partial';
        else b.className = 'ws-btn';
      }
    }

    // PERBAIKAN 2: toggleWorkstation mengandalkan BrainAI.getWorkstationKey secara dinamis
    function toggleWorkstation(wsKey){
      if (typeof BrainAI === 'undefined') return;
      
      let macs = mapData.machines.filter(m => BrainAI.getWorkstationKey(m.name, mapData.labels) === wsKey);
      if (macs.length === 0) return;

      let tgt = macs.every(m => m.status === 'RUNNING') ? 'OFF' : 'RUNNING';
      macs.forEach(m=>m.status = tgt); 
      renderGrid();
    }

    function setAllMachinesRunning(){ mapData.machines.forEach(m=>m.status='RUNNING'); renderGrid(); }
    function setAllMachinesOff(){ mapData.machines.forEach(m=>m.status='OFF'); renderGrid(); }
    function setAllCqiReady(){ mapData.cqis.forEach(c=>c.status='READY'); renderGrid(); }
    function setAllCqiOff(){ mapData.cqis.forEach(c=>c.status='OFF'); renderGrid(); }

    function toggleSidePanel(){ 
      const p = document.getElementById('sidePanel'); 
      p.classList.toggle('closed'); 
      document.getElementById('panelToggleBtn').innerText = p.classList.contains('closed') ? '▶' : '◀'; 
      setTimeout(()=>applyZoom(false), 310); 
    }

    function toggleHeatmap(){ 
      if(!activePlanning){ showToast("Tidak ada plan aktif dari Config!", "error"); return; } 
      showHeatmap = !showHeatmap;
      
      const btn = document.getElementById('menuHeatmapBtn');
      if (showHeatmap) {
          btn.innerText = '🔥 Heatmap ON';
          btn.className = 'btn btn-success';
          document.getElementById('heatmapLegend').classList.add('active');
      } else {
          btn.innerText = '🔥 Heatmap OFF';
          btn.className = 'btn btn-danger';
          document.getElementById('heatmapLegend').classList.remove('active');
      }
      renderGrid(); 
    }

    function handleSettingsClick() {
        if (editMode) {
            editMode = false;
            document.body.classList.remove('mode-edit');
            document.getElementById('settingsBtn').innerHTML = '⚙️ Setelan';
            document.getElementById('settingsBtn').classList.remove('btn-success');
            
            document.querySelectorAll('.control-landing').forEach(el => el.style.display = '');
            calculateGridBounds();
            renderGrid();
            showToast("Keluar dari Mode Edit", "success");
        } else {
            document.getElementById('settingsModal').classList.add('active');
        }
    }

    function closeSettingsModal() {
        document.getElementById('settingsModal').classList.remove('active');
    }

    function activateEditMode() {
        closeSettingsModal();
        editMode = true;
        document.body.classList.add('mode-edit');
        
        let btn = document.getElementById('settingsBtn');
        btn.innerHTML = '✔️ Selesai Edit';
        btn.classList.add('btn-success');
        
        document.querySelectorAll('.control-landing').forEach(el => el.style.display = 'none');
        
        calculateGridBounds();
        renderGrid();
        showToast("Mode Edit Aktif: Bisa Drag/Drop, Edit (Klik), atau Hapus", "info");
    }

    function cycleStatus(node, type){ 
      if (type === 'machine') {
          node.status = node.status === 'RUNNING' ? 'OFF' : 'RUNNING';
      } else if (type === 'cqi') {
          node.status = node.status === 'READY' ? 'OFF' : 'READY';
      }
      renderGrid(); 
    }

    function renderGrid(){
      const grid = document.getElementById('factoryGrid');
      grid.innerHTML = '';

      const fragment = document.createDocumentFragment();

      grid.style.gridTemplateColumns = `40px repeat(${totalCols}, 78px)`;
      grid.style.gridTemplateRows = `28px repeat(${totalRows}, 52px)`;

      const cellMap = {};

      let corner = document.createElement('div'); corner.className = 'excel-header excel-corner'; corner.innerText = 'R\\C';
      corner.style.gridRow = '1'; corner.style.gridColumn = '1'; fragment.appendChild(corner);

      for (let c=1; c<=totalCols; c++){
        let h = document.createElement('div'); h.className = 'excel-header'; h.innerText = c;
        h.style.gridRow = '1'; h.style.gridColumn = `${c+1}`; fragment.appendChild(h);
      }
      for (let r=1; r<=totalRows; r++){
        let h = document.createElement('div'); h.className = 'excel-header'; h.innerText = r;
        h.style.gridRow = `${r+1}`; h.style.gridColumn = '1'; fragment.appendChild(h);
        for (let c=1; c<=totalCols; c++){
          let cell = document.createElement('div'); cell.className = 'grid-cell'; cell.dataset.row = r; cell.dataset.col = c;
          cell.style.gridRow = `${r+1}`; cell.style.gridColumn = `${c+1}`;
          
          cell.ondragover = e => { if(editMode){ e.preventDefault(); cell.classList.add('drag-over'); } };
          cell.ondragleave = e => { cell.classList.remove('drag-over'); };
          cell.ondrop = e => handleDrop(e, r, c, cell);

          cellMap[`${r}-${c}`] = cell;
          fragment.appendChild(cell);
        }
      }

      if (Array.isArray(mapData.lines)){
        mapData.lines.forEach(line=>{
          let lEl = document.createElement('div'); lEl.className = 'line-box'; lEl.id = line.id;
          const row = Math.max(1, (line.row||1));
          const col = Math.max(1, (line.col||1));
          const width = Math.max(1, (line.width||1));
          const height = Math.max(1, (line.height||1));

          lEl.style.gridRow = `${row + 1} / span ${height}`; lEl.style.gridColumn = `${col + 1} / span ${width}`;
          if (line.borderColor) lEl.style.borderColor = line.borderColor;

          let headerStyle = line.textColor ? `style="color:${line.textColor}"` : '';
          lEl.innerHTML = `<div class="line-box-header" ${headerStyle}>${line.name}</div>`;
          
          if(editMode){
            lEl.onclick = (e) => { e.stopPropagation(); openEditModal(line, 'line'); };
          } else {
            lEl.style.pointerEvents = 'none';
          }

          fragment.appendChild(lEl);
        });
      }

      const assignments = new Map();
      const plannedCqiIds = new Set();
      const cqiColors = ['#e11d48', '#d97706', '#65a30d', '#059669', '#0891b2', '#0284c7', '#4f46e5', '#7c3aed', '#c026d3', '#be123c', '#b45309', '#4d7c0f', '#047857', '#0f766e', '#0369a1', '#4338ca', '#6d28d9', '#a21caf', '#9f1239', '#ea580c'];
      let cqiColorMap = {};

      if (activePlanning && Array.isArray(activePlanning.slots)){
        activePlanning.slots.forEach((s, idx) => {
          if (s && s.cqi && s.machines) {
            cqiColorMap[s.cqi.id] = cqiColors[idx % cqiColors.length];
            s.machines.forEach(m => assignments.set(String(m.id || m.name).trim(), s.cqi));
            if (s.machines.length > 0) plannedCqiIds.add(s.cqi.id);
          }
        });
      }

      const appendNode = (node, type) => {
        let cell = cellMap[`${node.row}-${node.col}`];
        if (!cell) return;
        let div = document.createElement('div'); div.className = `node node-${type} ${node.status || ''}`;
        div.id = node.id; div.innerHTML = `<span>${node.name}</span>`;

        if (type === 'machine') {
            let planCqi = assignments.get(String(node.id || node.name).trim());
            if (planCqi) {
                div.classList.add('planned');
                let nodeColor = cqiColorMap[planCqi.id] || '#16a34a';
                if (showHeatmap && !editMode) {
                    div.style.backgroundColor = nodeColor; div.style.borderColor = nodeColor; div.style.color = '#ffffff';
                    div.style.boxShadow = `0 2px 8px ${nodeColor}80`;
                    div.innerHTML += `<span class="heatmap-badge" style="background:#ffffff; color:${nodeColor};">${planCqi.name}</span>`;
                }
            }
        } else if (type === 'cqi') {
            if (plannedCqiIds.has(node.id)) {
                div.classList.add('planned-target');
                let nodeColor = cqiColorMap[node.id] || '#16a34a';
                if (showHeatmap && !editMode) {
                    div.style.backgroundColor = nodeColor; div.style.borderColor = nodeColor; div.style.color = '#ffffff';
                    div.style.boxShadow = `0 0 0 3px white, 0 0 18px ${nodeColor}`;
                }
            }
        }

        if (editMode) {
          div.draggable = true;
          div.ondragstart = (e) => {
            draggedNode = { id: node.id, type: type };
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => div.style.opacity = '0.5', 0);
          };
          div.ondragend = () => { div.style.opacity = '1'; draggedNode = null; };
          div.onclick = (e) => { e.stopPropagation(); openEditModal(node, type); };

          let d = document.createElement('div'); d.className = 'del-btn'; d.innerText = 'X';
          d.onclick = (e) => { e.stopPropagation(); deleteNode(node.id, type); };
          div.appendChild(d);
        } else {
          if (type === 'machine' || type === 'cqi') {
              div.onclick = (e) => {
                  e.stopPropagation();
                  cycleStatus(node, type);
              };
          }
        }
        
        cell.appendChild(div);
      };

      mapData.machines.forEach(m=>appendNode(m,'machine'));
      mapData.cqis.forEach(c=>appendNode(c,'cqi'));
      mapData.labels.forEach(l=>appendNode(l,'label'));

      if (showHeatmap && assignments.size > 0 && !editMode){
        const svgNS = "http://www.w3.org/2000/svg"; let svg = document.createElementNS(svgNS,"svg");
        svg.style.position = "absolute"; svg.style.top = "0"; svg.style.left = "0"; svg.style.width = "100%"; svg.style.height = "100%"; svg.style.pointerEvents = "none"; svg.style.zIndex = "8";
        const getCenter = (n) => ({ x: 40 + (n.col - 1) * 78 + 39, y: 28 + (n.row - 1) * 52 + 26 });

        assignments.forEach((cqiTarget, mId)=>{
          let mac = mapData.machines.find(x => String(x.id || x.name).trim() === mId);
          if (!mac || mac.status !== 'RUNNING') return;
          let tgt = mapData.cqis.find(x => String(x.id || x.name).trim() === String(cqiTarget.id || cqiTarget.name).trim());
          if (!tgt) return;

          let wsKey = (typeof BrainAI !== 'undefined') ? BrainAI.getWorkstationKey(mac.name || mac.id, mapData.labels) : null;
          let wl = wsKey ? mapData.labels.find(l => BrainAI.normalizeName(l.name) === BrainAI.normalizeName(wsKey)) : null;
          let pathColor = cqiColorMap[tgt.id] || '#16a34a';

          let mZone = (mac.col >= 32 || (wsKey && wsKey.endsWith('C'))) ? 'C' : 'AB';
          let cZone = (tgt.col >= 32) ? 'C' : 'AB';

          let p1 = getCenter(mac); let pEnd = getCenter(tgt); let pLabel = wl ? getCenter(wl) : null;
          let pCP1 = getCenter({row: 10, col: 31}); let pCP2 = getCenter({row: 12, col: 31});

          let routePoints = [p1];
          if (pLabel) routePoints.push(pLabel);

          let cqiMatch = String(tgt.name || tgt.id).match(/\d+/);
          let cqiNum = cqiMatch ? cqiMatch[0] : null;
          let isWWorOT = (cqiNum === '24' || cqiNum === '19' || wsKey === 'WW' || wsKey === 'OT');

          if (!isWWorOT && mZone === 'AB' && cZone === 'C') { routePoints.push(pCP1, pCP2); } 
          else if (!isWWorOT && mZone === 'C' && cZone === 'AB') { routePoints.push(pCP2, pCP1); }
          routePoints.push(pEnd);

          let dPath = `M ${routePoints[0].x} ${routePoints[0].y}`;
          for (let i = 1; i < routePoints.length; i++) {
              let prev = routePoints[i - 1]; let curr = routePoints[i];
              dPath += ` L ${curr.x} ${prev.y} L ${curr.x} ${curr.y}`;
          }

          let path = document.createElementNS(svgNS, "path");
          path.setAttribute("d", dPath); path.setAttribute("fill","none"); path.setAttribute("stroke", pathColor);
          path.setAttribute("stroke-width","4"); path.setAttribute("stroke-dasharray","8,5"); path.setAttribute("stroke-linejoin","round");
          svg.appendChild(path);
        });
        fragment.appendChild(svg);
      }

      grid.appendChild(fragment);
      updateStatsAndButtons();
    }

    function handleDrop(e, r, c, cellElem){ 
      if(!editMode || !draggedNode) return; 
      e.preventDefault(); 
      cellElem.classList.remove('drag-over');

      let list = mapData[draggedNode.type + 's'];
      let targetObj = list.find(x => x.id === draggedNode.id);
      if(targetObj) {
          targetObj.row = r;
          targetObj.col = c;
          if(targetObj.position) { targetObj.position.row = r; targetObj.position.col = c; }
          renderGrid();
      }
    }

    function deleteNode(id, type){ 
      if(!confirm('Hapus Node ini?')) return; 
      mapData[type+'s'] = mapData[type+'s'].filter(x => x.id !== id); 
      renderGrid(); 
    }

    function openNodeModal(type) {
        closeSettingsModal();
        activeModalType = type;
        editingNodeId = null;
        
        let centerRow = Math.max(1, Math.floor((mapViewport.scrollTop + mapViewport.clientHeight / 2) / (52 * (currentZoom || 1))));
        let centerCol = Math.max(1, Math.floor((mapViewport.scrollLeft + mapViewport.clientWidth / 2) / (78 * (currentZoom || 1))));

        buildModalForm(type, { name: '', row: centerRow, col: centerCol });
        document.getElementById('nodeModal').classList.add('active');
    }

    function openEditModal(node, type) {
        activeModalType = type;
        editingNodeId = node.id;
        buildModalForm(type, node);
        document.getElementById('nodeModal').classList.add('active');
    }

    function buildModalForm(type, data) {
        const c = document.getElementById('modalFormContainer');
        document.getElementById('modalTitle').innerText = editingNodeId ? `Edit ${type.toUpperCase()}` : `Tambah ${type.toUpperCase()}`;
        
        let html = `<div class="form-group"><label>Nama</label><input type="text" id="nName" class="form-control" value="${data.name || ''}" placeholder="Nama..." required></div>`;
        
        if (type === 'line') {
            html += `
                <div style="display:flex; gap:10px;">
                    <div class="form-group" style="flex:1"><label>Row (Y)</label><input type="number" id="nRow" class="form-control" value="${data.row || 1}"></div>
                    <div class="form-group" style="flex:1"><label>Col (X)</label><input type="number" id="nCol" class="form-control" value="${data.col || 1}"></div>
                </div>
                <div style="display:flex; gap:10px;">
                    <div class="form-group" style="flex:1"><label>Tinggi (Rows)</label><input type="number" id="nHeight" class="form-control" value="${data.height || 4}"></div>
                    <div class="form-group" style="flex:1"><label>Lebar (Cols)</label><input type="number" id="nWidth" class="form-control" value="${data.width || 4}"></div>
                </div>
                <div class="form-group"><label>Warna Garis (Hex)</label><input type="text" id="nBorder" class="form-control" value="${data.borderColor || '#3b82f6'}"></div>
                <div class="form-group"><label>Warna Teks (Hex)</label><input type="text" id="nText" class="form-control" value="${data.textColor || '#60a5fa'}"></div>
            `;
        } else {
            html += `
                <div style="display:flex; gap:10px;">
                    <div class="form-group" style="flex:1"><label>Row (Y)</label><input type="number" id="nRow" class="form-control" value="${data.row || 1}"></div>
                    <div class="form-group" style="flex:1"><label>Col (X)</label><input type="number" id="nCol" class="form-control" value="${data.col || 1}"></div>
                </div>
            `;
            if (type === 'machine') {
                html += `
                  <div class="form-group"><label>Cluster</label><input type="text" id="nCluster" class="form-control" value="${data.cluster || ''}"></div>
                  <div class="form-group"><label>Qty Timbang</label><input type="number" id="nQty" class="form-control" value="${data.qtytimbang || 8}"></div>
                `;
            } else if (type === 'cqi') {
                html += `<div class="form-group"><label>Prioritas Mesin (Pisahkan dg koma)</label><input type="text" id="nPrio" class="form-control" value="${(data.priority||[]).join(',')}"></div>`;
            }
        }

        c.innerHTML = html;
        setTimeout(()=>{ const ni = document.getElementById('nName'); if(ni) ni.focus(); },50);
    }

    function closeNodeModal(){ document.getElementById('nodeModal').classList.remove('active'); }

    function submitNodeModal(){
      const nameEl = document.getElementById('nName');
      let name = nameEl ? nameEl.value.trim() : '';
      if(!name){ alert('Nama wajib diisi'); return; }

      let rVal = parseInt(document.getElementById('nRow').value,10) || 1;
      let cVal = parseInt(document.getElementById('nCol').value,10) || 1;

      let list = mapData[activeModalType + 's'];
      let targetObj = editingNodeId ? list.find(x => x.id === editingNodeId) : null;
      
      if (!targetObj) {
          targetObj = { id: activeModalType.toUpperCase().charAt(0) + '-' + Date.now(), status: 'OFF' };
          list.push(targetObj);
      }

      targetObj.name = name;
      targetObj.row = rVal;
      targetObj.col = cVal;
      
      targetObj.position = { row: rVal, col: cVal };

      if (activeModalType === 'line') {
          targetObj.height = parseInt(document.getElementById('nHeight').value,10) || 4;
          targetObj.width = parseInt(document.getElementById('nWidth').value,10) || 4;
          targetObj.borderColor = document.getElementById('nBorder').value || '#3b82f6';
          targetObj.textColor = document.getElementById('nText').value || '#60a5fa';
      } else if (activeModalType === 'machine') {
          targetObj.cluster = document.getElementById('nCluster') ? document.getElementById('nCluster').value : '';
          targetObj.qtytimbang = document.getElementById('nQty') ? document.getElementById('nQty').value : 8;
      } else if (activeModalType === 'cqi') {
          let prioRaw = document.getElementById('nPrio') ? document.getElementById('nPrio').value : '';
          targetObj.priority = prioRaw.split(',').map(s=>s.trim()).filter(s=>s.length>0);
      }

      closeNodeModal();
      calculateGridBounds(); 
      renderGrid();
    }

    function exportMapJson(){
      let blob = new Blob([JSON.stringify(mapData, null, 2)], { type: "application/json" });
      let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "map.json"; a.click();
      closeSettingsModal();
    }

    function applyZoom(init=false){
      const currentGridWidth = 40 + (totalCols * 78);
      const currentGridHeight = 28 + (totalRows * 52);
      
      let mx = mapViewport.clientWidth / currentGridWidth;
      let my = mapViewport.clientHeight / currentGridHeight;
      let fitZoom = Math.max(mx, my);

      if (!isFinite(fitZoom) || fitZoom <= 0) fitZoom = 0.1;
      if (init || currentZoom === null) {
        currentZoom = fitZoom;
        initialFitZoom = fitZoom;
      }
      currentZoom = Math.max(0.1, Math.min(3, currentZoom));

      document.getElementById('factoryGrid').style.transform = `scale(${currentZoom})`;
      document.getElementById('gridWrapper').style.width = `${currentGridWidth * currentZoom}px`;
      document.getElementById('gridWrapper').style.height = `${currentGridHeight * currentZoom}px`;

      updateZoomButtons();
    }

    function updateZoomButtons(){
      const outBtn = document.getElementById('zoomOutBtn');
      if (!outBtn) return;
      if (initialFitZoom !== null && currentZoom > initialFitZoom + 0.01) { outBtn.style.display = 'inline-flex'; } 
      else { outBtn.style.display = 'none'; }
    }

    function zoomIn(){ currentZoom = (currentZoom || 1) + 0.1; applyZoom(); }
    function zoomOut(){ currentZoom = (currentZoom || 1) - 0.1; applyZoom(); }

    function goToConfig(){
      let runM = mapData.machines.filter(m=>m.status==='RUNNING');
      let rdyC = mapData.cqis.filter(c=>c.status==='READY');
      
      if (runM.length===0 || rdyC.length===0){ 
        showToast("Pastikan ada mesin RUNNING & CQI READY sebelum lanjut config!", "error"); 
        return; 
      }
      
      localStorage.setItem('factory_internal_storage', JSON.stringify({ machines: mapData.machines, cqis: mapData.cqis }));
      sessionStorage.setItem('planning_state', JSON.stringify({ machines: runM, cqis: rdyC, labels: mapData.labels }));
      window.location.href = 'config.html';
    }

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => applyZoom(), 150);
    });

    loadMap();
  </script>
</body>
</html>
