<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Factory Machine Map</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6">
  <div class="container mx-auto max-w-5xl">
    <div class="flex justify-between items-center border-b border-gray-700 pb-4 mb-6">
      <h1 class="text-2xl font-bold text-blue-400">Admin Panel - Manajemen Mesin</h1>
      <a href="index.html" class="bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded text-sm border border-gray-600">&larr; Kembali ke Peta</a>
    </div>

    <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 mb-6">
      <h2 class="text-sm font-semibold text-gray-300 mb-3">Konfigurasi Penyimpanan GitHub Repository</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <input type="text" id="ghOwner" placeholder="Username / Owner" class="bg-gray-900 border border-gray-600 rounded px-3 py-1.5 text-sm" />
        <input type="text" id="ghRepo" placeholder="Nama Repository" class="bg-gray-900 border border-gray-600 rounded px-3 py-1.5 text-sm" />
        <input type="password" id="ghToken" placeholder="GitHub PAT (repo scope)" class="bg-gray-900 border border-gray-600 rounded px-3 py-1.5 text-sm" />
      </div>
    </div>

    <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden mb-6">
      <div class="p-4 border-b border-gray-700 flex justify-between items-center">
        <h2 class="font-semibold">Daftar Mesin Produksi</h2>
        <button onclick="addNewMachine()" class="bg-green-600 hover:bg-green-500 px-3 py-1.5 rounded text-sm font-medium">+ Tambah Mesin</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-gray-900/60 text-gray-400 border-b border-gray-700">
              <th class="p-3">Nama Mesin</th>
              <th class="p-3">Tipe</th>
              <th class="p-3">Line & Area</th>
              <th class="p-3">Koordinat (X, Y)</th>
              <th class="p-3">Status</th>
              <th class="p-3">CQI (Pisahkan koma)</th>
              <th class="p-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="adminTableBody" class="divide-y divide-gray-700">
            </tbody>
        </table>
      </div>
    </div>

    <div class="flex justify-end">
      <button onclick="saveToGitHub()" class="bg-blue-600 hover:bg-blue-500 px-6 py-2.5 rounded font-bold shadow-lg">
        Simpan Perubahan ke GitHub JSON
      </button>
    </div>
  </div>

  <script>
    let machines = [];
    let fileSha = null;

    async function loadData() {
      try {
        const res = await fetch('data/mesin.json');
        machines = await res.json();
        renderTable();
      } catch (e) {
        alert("Gagal membaca /data/mesin.json");
      }
    }

    function renderTable() {
      const tbody = document.getElementById('adminTableBody');
      tbody.innerHTML = '';

      machines.forEach((m, idx) => {
        const row = document.createElement('tr');
        row.className = 'hover:bg-gray-700/40';
        row.innerHTML = `
          <td class="p-3"><input type="text" value="${m.nama_mesin}" onchange="updateVal(${idx}, 'nama_mesin', this.value)" class="bg-gray-900 border border-gray-600 rounded px-2 py-1 w-28" /></td>
          <td class="p-3"><input type="text" value="${m.tipe}" onchange="updateVal(${idx}, 'tipe', this.value)" class="bg-gray-900 border border-gray-600 rounded px-2 py-1 w-24" /></td>
          <td class="p-3">
            <input type="text" value="${m.line}" onchange="updateVal(${idx}, 'line', this.value)" class="bg-gray-900 border border-gray-600 rounded px-2 py-1 w-20 mb-1 block" />
            <input type="text" value="${m.area}" onchange="updateVal(${idx}, 'area', this.value)" class="bg-gray-900 border border-gray-600 rounded px-2 py-1 w-20" />
          </td>
          <td class="p-3">
            <input type="number" value="${m.x}" onchange="updateVal(${idx}, 'x', parseInt(this.value))" class="bg-gray-900 border border-gray-600 rounded px-2 py-1 w-16 mr-1" />
            <input type="number" value="${m.y}" onchange="updateVal(${idx}, 'y', parseInt(this.value))" class="bg-gray-900 border border-gray-600 rounded px-2 py-1 w-16" />
          </td>
          <td class="p-3">
            <select onchange="updateVal(${idx}, 'status', this.value)" class="bg-gray-900 border border-gray-600 rounded px-2 py-1">
              <option value="RUNNING" ${m.status === 'RUNNING' ? 'selected' : ''}>RUNNING</option>
              <option value="STOP" ${m.status === 'STOP' ? 'selected' : ''}>STOP</option>
              <option value="STANDBY" ${m.status === 'STANDBY' ? 'selected' : ''}>STANDBY</option>
            </select>
          </td>
          <td class="p-3">
            <input type="text" value="${(m.cqi || []).join(',')}" onchange="updateCQI(${idx}, this.value)" class="bg-gray-900 border border-gray-600 rounded px-2 py-1 w-32" />
          </td>
          <td class="p-3 text-center">
            <button onclick="removeMachine(${idx})" class="text-red-400 hover:text-red-300 font-bold">&times; Hapus</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function updateVal(index, key, value) {
      machines[index][key] = value;
    }

    function updateCQI(index, valueString) {
      machines[index].cqi = valueString.split(',').map(s => s.trim()).filter(s => s !== '');
    }

    function addNewMachine() {
      machines.push({
        id: "NEW-" + Date.now(),
        nama_mesin: "AST45 00",
        tipe: "AST",
        line: "LINE A",
        area: "1A",
        barcode: "NEW",
        x: 100,
        y: 100,
        status: "RUNNING",
        cqi: [],
        man_power: 1
      });
      renderTable();
    }

    function removeMachine(index) {
      machines.splice(index, 1);
      renderTable();
    }

    // Integrasi Simpan Langsung ke GitHub (tanpa backend server)
    async function saveToGitHub() {
      const owner = document.getElementById('ghOwner').value;
      const repo = document.getElementById('ghRepo').value;
      const token = document.getElementById('ghToken').value;
      const path = 'data/mesin.json';

      if (!owner || !repo || !token) {
        alert('Harap isi konfigurasi GitHub Owner, Repo, dan PAT Token terlebih dahulu!');
        return;
      }

      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

      try {
        // Ambil SHA terbaru dari file
        const getRes = await fetch(url, {
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        const fileData = await getRes.json();
        const sha = fileData.sha;

        // Commit perubahan
        const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(machines, null, 2))));
        const putRes = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Update mesin.json via Admin Panel',
            content: contentEncoded,
            sha: sha
          })
        });

        if (putRes.ok) {
          alert('Berhasil memperbarui data mesin.json ke repositori GitHub!');
        } else {
          const err = await putRes.json();
          alert('Gagal menyimpan: ' + err.message);
        }
      } catch (err) {
        alert('Terjadi kesalahan koneksi GitHub API.');
        console.error(err);
      }
    }

    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
