<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konfigurasi & Planning</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; margin: 0; }
    .container { max-width: 1200px; margin: auto; display: flex; gap: 20px; align-items: flex-start; }
    .panel { background: #1e293b; padding: 20px; border-radius: 8px; flex: 1; border: 1px solid #334155; }
    
    h2, h3 { border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top: 0; }
    .form-group { margin-bottom: 20px; }
    
    .group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .group-header label { margin-bottom: 0; color: #94a3b8; font-size: 0.9rem; font-weight: bold; }
    .group-actions { display: flex; gap: 5px; }

    input, textarea { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box;}
    
    .btn { background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; }
    .btn:hover { background: #2563eb; }
    .btn-success { background: #10b981; } .btn-success:hover { background: #059669; }

    /* Dynamic List Styles */
    .list-item { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; }
    .list-item .num { width: 25px; color: #94a3b8; font-size: 0.9rem; text-align: right; margin-right: 5px; font-weight: bold;}
    .list-item input { flex: 1; margin: 0; padding: 8px; }
    
    .locked-input { background: #1e293b !important; color: #10b981 !important; border-color: #10b981 !important; cursor: not-allowed; font-weight: bold; }

    .btn-sm { padding: 6px 10px; font-size: 0.85rem; background: #334155; border: none; color: white; cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center; gap: 3px; }
    .btn-sm:hover { background: #475569; }
    .btn-lock { background: #10b981; } .btn-lock:hover { background: #059669; }
    .btn-edit { background: #f59e0b; } .btn-edit:hover { background: #d97706; }
    .btn-del { background: #ef4444; } .btn-del:hover { background: #dc2626; }
    
    .add-btn { background: #0f172a; border: 1px dashed #3b82f6; color: #3b82f6; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; width: 100%; margin-top: 5px; transition: 0.2s;}
    .add-btn:hover { background: #1e3a8a; color: white;}
    
    #dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-box { background: #0f172a; padding: 10px; border-radius: 6px; text-align: center; border: 1px solid #334155;}
    .stat-box span { font-size: 1.2rem; font-weight: bold; color: #10b981; }

    /* Text Editor Style */
    #textOutput { height: 400px; font-family: monospace; font-size: 0.85rem; color: #e2e8f0; resize: vertical; line-height: 1.5; }
    .actions { display: flex; gap: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel" style="max-width: 420px;">
      <h2>Konfigurasi Planning</h2>
      
      <div class="form-group">
        <div class="group-header">
          <label>CORE Manpower</label>
          <div class="group-actions">
            <button class="btn-sm" onclick="shiftListUp(storageKeys.core, 'coreList')" title="Rotasi Naik">▲ Naik</button>
            <button class="btn-sm" onclick="shiftListDown(storageKeys.core, 'coreList')" title="Rotasi Turun">▼ Turun</button>
          </div>
        </div>
        <div id="coreList"></div>
        <button class="add-btn" onclick="addNewItem(storageKeys.core, getSavedData(storageKeys.core).length, 'coreList')">+ Tambah Core Baru</button>
      </div>
      
      <div class="form-group">
        <div class="group-header">
          <label>NON CORE Manpower</label>
          <div class="group-actions">
            <button class="btn-sm" onclick="shiftListUp(storageKeys.nonCore, 'nonCoreList')" title="Rotasi Naik">▲ Naik</button>
            <button class="btn-sm" onclick="shiftListDown(storageKeys.nonCore, 'nonCoreList')" title="Rotasi Turun">▼ Turun</button>
          </div>
        </div>
        <div id="nonCoreList"></div>
        <button class="add-btn" onclick="addNewItem(storageKeys.nonCore, getSavedData(storageKeys.nonCore).length, 'nonCoreList')">+ Tambah Non Core Baru</button>
      </div>
      
      <div class="form-group">
        <div class="group-header">
          <label>QC PASSED</label>
          <div class="group-actions">
            <button class="btn-sm" onclick="shiftListUp(storageKeys.qcPassed, 'qcPassedList')" title="Rotasi Naik">▲ Naik</button>
            <button class="btn-sm" onclick="shiftListDown(storageKeys.qcPassed, 'qcPassedList')" title="Rotasi Turun">▼ Turun</button>
          </div>
        </div>
        <div id="qcPassedList"></div>
        <button class="add-btn" onclick="addNewItem(storageKeys.qcPassed, getSavedData(storageKeys.qcPassed).length, 'qcPassedList')">+ Tambah QC Baru</button>
      </div>

      <div class="form-group"><label style="color:#94a3b8; font-size:0.9rem; font-weight:bold;">MIL-STD</label><input type="text" id="milStd" value=""></div>
      <div class="form-group"><label style="color:#94a3b8; font-size:0.9rem; font-weight:bold;">Standby OT</label><input type="text" id="standbyOt" value=""></div>
      <div class="form-group"><label style="color:#94a3b8; font-size:0.9rem; font-weight:bold;">Support FG</label><input type="text" id="supportFg" value=""></div>

      <button class="btn" onclick="executePlan()">🧠 Generate AI Planning</button>
      <button class="btn btn-success" onclick="validateAndExport()">✅ Validasi & Copy Text</button>
      <div class="actions">
        <button class="btn" style="background:#25d366" onclick="shareWA()">💬 WA</button>
        <button class="btn" style="background:#f59e0b" onclick="exportExcel()">📊 Excel</button>
      </div>
      <a href="index.html" style="color:#94a3b8; font-size:0.8rem; text-decoration:none; display:block; text-align:center; margin-top: 10px;">⬅ Kembali ke Map</a>
    </div>

    <div class="panel" style="flex: 2;">
      <h2>Dashboard Performance & Preview</h2>
      <div id="dashboard">
        <div class="stat-box">Target Mesin: <br><span id="db-run">0</span></div>
        <div class="stat-box">Ter-cover: <br><span id="db-cov">0</span></div>
        <div class="stat-box">Coverage %: <br><span id="db-pct">0%</span></div>
        <div class="stat-box">CQI Dipakai: <br><span id="db-cqi">0</span></div>
        <div class="stat-box">Rata Jarak: <br><span id="db-dist">0 m</span></div>
        <div class="stat-box">AI Success Rate: <br><span id="db-acc">0%</span></div>
      </div>
      
      <div id="textOutputContainer" style="display:none; margin-top: 20px;">
        <h3>Editor Output Final</h3>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px;">Anda bisa melakukan pengeditan manual secara langsung di kotak teks bawah ini.</p>
        <textarea id="textOutput" spellcheck="false"></textarea>
      </div>
    </div>
  </div>

  <script src="brain.js"></script>
  <script>
    const storageKeys = {
      core: 'core_names',
      nonCore: 'noncore_names',
      qcPassed: 'qc_names'
    };

    function getSavedData(key) {
      let raw = JSON.parse(localStorage.getItem(key)) || [''];
      return raw.map(item => {
        if (typeof item === 'string') return { name: item, locked: false };
        return item;
      });
    }

    function saveData(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }

    function renderList(containerId, storageKey) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      const data = getSavedData(storageKey);

      data.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'list-item';

        const num = document.createElement('span');
        num.className = 'num';
        num.innerText = (index + 1) + '.';

        const input = document.createElement('input');
        input.type = 'text';
        input.value = item.name;
        input.placeholder = 'Ketik nama & tekan Enter...';
        if (item.locked) {
          input.readOnly = true;
          input.classList.add('locked-input');
        }
        
        input.oninput = (e) => updateItemName(storageKey, index, e.target.value);
        input.onkeydown = (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            addNewItem(storageKey, index + 1, containerId);
          }
        };

        const lockBtn = document.createElement('button');
        lockBtn.className = item.locked ? 'btn-sm btn-edit' : 'btn-sm btn-lock';
        lockBtn.innerHTML = item.locked ? '✏️ Edit' : '✓';
        lockBtn.title = item.locked ? 'Buka Kunci Nama' : 'Kunci Nama';
        lockBtn.onclick = () => toggleLock(storageKey, index, containerId);

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-sm btn-del';
        delBtn.innerHTML = 'X';
        delBtn.title = 'Hapus Baris';
        delBtn.onclick = () => removeItem(storageKey, index, containerId);

        row.appendChild(num);
        row.appendChild(input);
        row.appendChild(lockBtn);
        row.appendChild(delBtn);
        container.appendChild(row);
      });
    }

    function updateItemName(key, index, value) {
      const data = getSavedData(key);
      data[index].name = value;
      saveData(key, data);
    }

    function toggleLock(key, index, containerId) {
      const data = getSavedData(key);
      data[index].locked = !data[index].locked;
      saveData(key, data);
      renderList(containerId, key);
    }

    function addNewItem(key, index, containerId) {
      const data = getSavedData(key);
      if (index > data.length) index = data.length;
      data.splice(index, 0, { name: '', locked: false });
      saveData(key, data);
      renderList(containerId, key);
      
      setTimeout(() => {
        const inputs = document.getElementById(containerId).querySelectorAll('input');
        if (inputs[index]) inputs[index].focus();
      }, 10);
    }

    function removeItem(key, index, containerId) {
      const data = getSavedData(key);
      if (data.length === 1) {
        data[0] = { name: '', locked: false };
      } else {
        data.splice(index, 1);
      }
      saveData(key, data);
      renderList(containerId, key);
    }

    function shiftListUp(key, containerId) {
      const data = getSavedData(key);
      if (data.length <= 1) return;
      const first = data.shift();
      data.push(first);
      saveData(key, data);
      renderList(containerId, key);
    }

    function shiftListDown(key, containerId) {
      const data = getSavedData(key);
      if (data.length <= 1) return;
      const last = data.pop();
      data.unshift(last);
      saveData(key, data);
      renderList(containerId, key);
    }

    function getListData(storageKey) {
      const data = getSavedData(storageKey);
      return data.map(item => item.name.trim()).filter(name => name !== '');
    }

    // --- MANAJEMEN STATE & PLANNING ---
    let state = null;
    let currentPlan = [];
    let finalConfig = {};

    window.onload = () => {
      renderList('coreList', storageKeys.core);
      renderList('nonCoreList', storageKeys.nonCore);
      renderList('qcPassedList', storageKeys.qcPassed);

      state = JSON.parse(sessionStorage.getItem('planning_state'));
      if (!state) { 
        alert("Data kosong! Kembali ke Map."); 
        window.location.href='index.html'; 
      } else {
        document.getElementById('db-run').innerText = state.machines.length;
      }
    };

    function executePlan() {
      if(!state) return;

      let coreData = getListData(storageKeys.core);
      let nonCoreData = getListData(storageKeys.nonCore);
      let qcData = getListData(storageKeys.qcPassed);

      let qcPassedFormatted = "";
      if (qcData.length === 1) {
        qcPassedFormatted = qcData[0];
      } else if (qcData.length > 1) {
        qcPassedFormatted = qcData.map((name, i) => `${i + 1}. ${name}`).join('\n');
      }

      finalConfig = {
        coreNames: coreData,
        core: coreData.length > 0 ? coreData.length : 1,
        nonCoreNames: nonCoreData,
        nonCore: nonCoreData.length,
        qcPassedNames: qcData,
        qcPassed: qcPassedFormatted, 
        milStd: document.getElementById('milStd').value,
        standbyOt: document.getElementById('standbyOt').value,
        supportFg: document.getElementById('supportFg').value
      };
      
      currentPlan = BrainAI.generatePlan(state.machines, state.cqis, finalConfig);
      
      updateDashboard();
      generateTextOutput();
    }

    function updateDashboard() {
      let covered = 0;
      let totalDist = 0;
      let totalHist = 0;
      let mCount = 0;

      currentPlan.forEach(slot => {
        covered += slot.machines.length;
        slot.machines.forEach(m => {
          totalDist += BrainAI.getDistance(m.row, m.col, slot.cqi.row, slot.cqi.col);
          totalHist += BrainAI.getHistory(m.id, slot.cqi.id);
          mCount++;
        });
      });

      document.getElementById('db-cov').innerText = covered;
      document.getElementById('db-pct').innerText = ((covered / state.machines.length) * 100).toFixed(1) + '%';
      document.getElementById('db-cqi').innerText = currentPlan.length;
      document.getElementById('db-dist').innerText = mCount ? (totalDist / mCount).toFixed(2) + ' m' : '0 m';
      document.getElementById('db-acc').innerText = mCount ? (totalHist / mCount).toFixed(1) + '%' : '0%';
    }

    function generateTextOutput() {
      if(currentPlan.length === 0) return;
      let output = BrainAI.formatText(currentPlan, finalConfig);
      
      let coreData = getListData(storageKeys.core);
      let nonCoreData = getListData(storageKeys.nonCore);
      let qcData = getListData(storageKeys.qcPassed);

      // --- 1. AMBIL KENDALI PENUH ATAS FOOTER ---
      let cleanOutput = output;
      const footerKeywords = [/QC PASSED/i, /MIL-STD/i, /MIL STD/i, /Standby OT/i, /Support FG/i];
      let minIndex = cleanOutput.length;
      
      footerKeywords.forEach(regex => {
        let match = cleanOutput.match(regex);
        if (match && match.index < minIndex) {
          minIndex = match.index;
        }
      });
      
      if (minIndex < cleanOutput.length) {
        cleanOutput = cleanOutput.substring(0, minIndex).trim(); // Hanya sisakan teks planning
      }

      // --- 2. PERBAIKAN URUTAN REPLACE! (NON CORE DIGANTI LEBIH DULU) ---
      
      // Langkah A: Ganti teks "NON CORE" lebih dulu. 
      // Karena jika "CORE" diganti duluan, "NON CORE 1" akan berubah jadi "NON (Nama Core)".
      nonCoreData.forEach((name, i) => {
        let regex = new RegExp(`\\bNON\\s*[-]?\\s*CORE\\s*[-]?\\s*${i+1}\\b`, 'gi');
        cleanOutput = cleanOutput.replace(regex, name);
      });

      // Langkah B: Setelah tidak ada lagi kata NON CORE, baru kita ganti kata "CORE".
      coreData.forEach((name, i) => {
        let regex = new RegExp(`\\bCORE\\s*[-]?\\s*${i+1}\\b`, 'gi');
        cleanOutput = cleanOutput.replace(regex, name);
      });


      // --- 3. SUSUN ULANG & TAMBAHKAN FOOTER MANUAL ---
      let qcPassedText = "";
      if (qcData.length === 1) {
        qcPassedText = qcData[0];
      } else if (qcData.length > 1) {
        qcPassedText = qcData.map((name, i) => `${i + 1}. ${name}`).join('\n');
      }

      let milStdVal = document.getElementById('milStd').value.trim();
      let standbyVal = document.getElementById('standbyOt').value.trim();
      let supportVal = document.getElementById('supportFg').value.trim();

      cleanOutput += `\n\nQC PASSED :\n${qcPassedText}`;
      cleanOutput += `\nMIL-STD : ${milStdVal}`;
      cleanOutput += `\nStandby OT : ${standbyVal}`;
      cleanOutput += `\nSupport FG : ${supportVal}`;

      document.getElementById('textOutput').value = cleanOutput;
      document.getElementById('textOutputContainer').style.display = 'block';
    }

    function validateAndExport() {
      if(currentPlan.length === 0) return alert("Generate planning dulu!");
      
      let errors = BrainAI.validate(currentPlan, state.machines.length);
      if (errors.length > 0) {
        alert("VALIDASI GAGAL! Perbaiki rule berikut:\n- " + errors.join("\n- "));
        return;
      }

      currentPlan.forEach(slot => {
        slot.machines.forEach(m => BrainAI.recordHistory(m.id, slot.cqi.id, true));
      });

      let finalEditedText = document.getElementById('textOutput').value;
      navigator.clipboard.writeText(finalEditedText);
      alert("Validasi Lulus! Output berhasil dicopy ke Clipboard.");
    }

    function shareWA() {
      let text = document.getElementById('textOutput').value;
      if (!text) return alert("Generate planning dan pastikan text ada isinya!");
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    function exportExcel() {
      if(currentPlan.length === 0) return alert("Generate planning dulu!");
      let csv = "CQI,CORE,NON CORE,KODE MESIN,LINE\n";
      
      let coreData = getListData(storageKeys.core);
      let nonCoreData = getListData(storageKeys.nonCore);

      currentPlan.forEach(slot => {
        let slotCore = String(slot.core);
        coreData.forEach((name, i) => {
          let regex = new RegExp(`\\bCORE\\s*[-]?\\s*${i+1}\\b`, 'gi');
          slotCore = slotCore.replace(regex, name);
        });

        let ncString = slot.nonCore.join(" & ") || "-";
        nonCoreData.forEach((name, i) => {
          let regex = new RegExp(`\\bNON\\s*[-]?\\s*CORE\\s*[-]?\\s*${i+1}\\b`, 'gi');
          ncString = ncString.replace(regex, name);
        });

        slot.machines.forEach(m => {
          csv += `${slot.cqi.name},${slotCore},${ncString},${m.name},${m.line}\n`;
        });
      });
      let blob = new Blob([csv], { type: 'text/csv' });
      let a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = "Planning_Liquid_3.csv";
      a.click();
    }
  </script>
</body>
</html>
