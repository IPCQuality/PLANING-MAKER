<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro CQI Planning Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root {
    --bg: #e6e9ef;
    --surface: #e6e9ef;
    --text-main: #2d3748;
    --text-muted: #718096;
    --accent: #3182ce;
    --success: #38a169;
    --warning: #dd6b20;
    --danger: #e53e3e;
    --shadow-soft: 6px 6px 12px #c8cbd1, -6px -6px 12px #ffffff;
    --shadow-inset: inset 4px 4px 8px #c8cbd1, inset -4px -4px 8px #ffffff;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* Topbar Neumorphism */
  .topbar { height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--surface); box-shadow: var(--shadow-soft); z-index: 10; }
  .top-info { display: flex; gap: 16px; align-items: center; }
  .btn-neo { background: var(--surface); border: none; padding: 10px 16px; border-radius: 8px; color: var(--text-main); font-weight: 600; cursor: pointer; box-shadow: var(--shadow-soft); display: flex; align-items: center; gap: 8px; transition: 0.2s; }
  .btn-neo:active { box-shadow: var(--shadow-inset); }
  .btn-neo:hover { color: var(--accent); }
  
  /* Dashboard Summary */
  .dashboard-summary { display: flex; gap: 16px; padding: 16px 24px; background: var(--bg); }
  .summary-card { flex: 1; padding: 16px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-soft); text-align: center; }
  .summary-card h4 { margin: 0; font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
  .summary-card span { font-size: 24px; font-weight: 700; color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  /* Main Layout */
  .main-container { display: flex; flex: 1; overflow: hidden; padding: 0 24px 24px; gap: 24px; }
  
  /* Visual Editor Grid */
  .visual-editor { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 10px; }
  
  /* CQI Card */
  .cqi-card { background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-soft); display: flex; flex-direction: column; gap: 12px; transition: 0.3s; }
  .cqi-card.locked { opacity: 0.8; }
  .cqi-card.drag-over { box-shadow: inset 0 0 0 2px var(--accent), var(--shadow-soft); }
  .cqi-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #cbd5e0; padding-bottom: 8px; }
  .cqi-title { font-weight: 700; font-size: 16px; }
  .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
  .status-normal { background: #c6f6d5; color: var(--success); }
  .status-warning { background: #feebc8; color: var(--warning); }
  .status-overload { background: #fed7d7; color: var(--danger); }

  /* Draggable Machines */
  .machine-list { min-height: 80px; display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; background: #d9dce3; border-radius: 8px; box-shadow: var(--shadow-inset); }
  .machine-tag { background: var(--surface); padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: grab; box-shadow: 3px 3px 6px #c8cbd1, -3px -3px 6px #ffffff; display: flex; align-items: center; gap: 4px; }
  .machine-tag:active { cursor: grabbing; box-shadow: var(--shadow-inset); }

  /* Change Log Sidebar */
  .sidebar { width: 300px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-soft); display: flex; flex-direction: column; padding: 16px; }
  .log-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .log-item { font-size: 11px; padding: 8px; border-radius: 6px; background: var(--bg); box-shadow: var(--shadow-inset); display: flex; flex-direction: column; }
  .log-item .time { color: var(--accent); font-weight: bold; }

  /* AI Assistant Popup */
  .ai-popup { position: fixed; bottom: 24px; right: 24px; width: 320px; background: var(--surface); padding: 16px; border-radius: var(--radius); box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-left: 4px solid var(--accent); transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100; }
  .ai-popup.show { transform: translateX(0); }
  
  /* Modal Detail */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; place-items: center; z-index: 1000; backdrop-filter: blur(4px); }
  .modal-content { background: var(--surface); padding: 24px; border-radius: var(--radius); width: 400px; box-shadow: var(--shadow-soft); }
</style>
</head>
<body>

<header class="topbar">
  <div class="top-info">
    <h1 style="font-size: 18px; margin:0; color: var(--accent);">CQI Planning Panel</h1>
    <div style="font-size: 12px; color: var(--text-muted);"><i data-lucide="calendar"></i> <span id="currentDate"></span> | Shift <span id="currentShift">1</span></div>
  </div>
  <div style="display: flex; gap: 12px;">
    <button class="btn-neo" onclick="generateAI()"><i data-lucide="bot"></i> AI Generate</button>
    <button class="btn-neo" onclick="optimizePlan()"><i data-lucide="zap"></i> Optimize</button>
    <button class="btn-neo" onclick="validatePlan()"><i data-lucide="check-circle"></i> Validate</button>
    <button class="btn-neo" onclick="undo()"><i data-lucide="undo"></i></button>
    <button class="btn-neo" onclick="redo()"><i data-lucide="redo"></i></button>
    <button class="btn-neo" onclick="savePlan()"><i data-lucide="save"></i> Save</button>
  </div>
</header>

<div class="dashboard-summary">
  <div class="summary-card"><h4>Mode Planning</h4><span id="kpi-mode">AI AUTO</span></div>
  <div class="summary-card"><h4>Total Mesin</h4><span id="kpi-machines">0</span></div>
  <div class="summary-card"><h4>Coverage Area</h4><span id="kpi-coverage">0%</span></div>
  <div class="summary-card"><h4>CQI Aktif</h4><span id="kpi-cqi">0</span></div>
  <div class="summary-card"><h4>Status Planning</h4><span id="kpi-status" style="color: var(--success);">NORMAL</span></div>
</div>

<div class="main-container">
  <!-- Visual Editor -->
  <div class="visual-editor" id="visualEditor">
    <!-- Card akan di-generate via JavaScript -->
  </div>

  <!-- Sidebar: Change Log & AI History -->
  <div class="sidebar">
    <h3 style="margin:0; font-size: 14px; border-bottom: 1px solid #cbd5e0; padding-bottom: 8px;"><i data-lucide="history"></i> Activity Log</h3>
    <div class="log-list" id="activityLog"></div>
  </div>
</div>

<!-- AI Assistant Toast -->
<div class="ai-popup" id="aiAssistant">
  <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
    <i data-lucide="bot" style="color: var(--accent);"></i>
    <strong style="font-size: 14px;">AI Recommendation</strong>
  </div>
  <p id="aiMessage" style="font-size: 12px; margin: 0; color: var(--text-muted);"></p>
</div>

<!-- Modal Detail -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h3 style="margin: 0;" id="modalTitle">Detail CQI</h3>
      <button class="btn-neo" onclick="closeModal()" style="padding: 6px;"><i data-lucide="x"></i></button>
    </div>
    <div id="modalBody" style="font-size: 13px; line-height: 1.6;"></div>
  </div>
</div>

<script>
  // Inisialisasi Icon
  lucide.createIcons();
  
  // Realtime Date
  setInterval(() => {
    const now = new Date();
    document.getElementById('currentDate').innerText = now.toLocaleString('id-ID');
  }, 1000);

  // Global State (Mockup for Editor)
  let currentPlan = [];
  let changeHistory = [];
  let historyIndex = -1;

  // Render Visual Cards
  function renderVisualEditor() {
    const container = document.getElementById('visualEditor');
    container.innerHTML = '';
    
    currentPlan.forEach((slot, index) => {
      const isLocked = slot.isLocked ? 'locked' : '';
      const statusClass = getStatusClass(slot);
      const score = Math.floor(Math.random() * 20) + 80; // Mock score

      const card = document.createElement('div');
      card.className = `cqi-card ${isLocked}`;
      card.innerHTML = `
        <div class="cqi-header">
          <div class="cqi-title">${slot.cqi.name}</div>
          <div style="display: flex; gap: 6px; align-items: center;">
            <span class="status-badge ${statusClass}">${slot.status || 'NORMAL'}</span>
            <button class="btn-neo" style="padding: 4px; box-shadow: none;" onclick="toggleLock(${index})">
              <i data-lucide="${slot.isLocked ? 'lock' : 'unlock'}"></i>
            </button>
            <button class="btn-neo" style="padding: 4px; box-shadow: none;" onclick="openDetail(${index})">
              <i data-lucide="info"></i>
            </button>
          </div>
        </div>
        <div style="font-size: 12px; color: var(--text-muted);">
          Core: <strong>${slot.core}</strong> | NC: <strong>${slot.nonCore.length}</strong> | AI Score: <strong>${score}%</strong>
        </div>
        <div class="machine-list" id="drop-${index}" ondragover="allowDrop(event)" ondrop="drop(event, ${index})">
          ${slot.machines.map(m => `
            <div class="machine-tag" draggable="${!slot.isLocked}" ondragstart="drag(event, '${m.id}', ${index})">
              <i data-lucide="settings" style="width: 12px;"></i> ${m.name}
            </div>
          `).join('')}
        </div>
      `;
      container.appendChild(card);
    });
    lucide.createIcons();
    updateKPI();
  }

  // --- Drag & Drop Logic ---
  let draggedMachineId = null;
  let sourceCqiIndex = null;

  function allowDrop(ev) { ev.preventDefault(); }
  function drag(ev, machineId, cqiIndex) {
    draggedMachineId = machineId;
    sourceCqiIndex = cqiIndex;
    ev.dataTransfer.setData("text", machineId);
  }
  function drop(ev, targetCqiIndex) {
    ev.preventDefault();
    if (sourceCqiIndex === targetCqiIndex) return;
    if (currentPlan[targetCqiIndex].isLocked || currentPlan[sourceCqiIndex].isLocked) {
        showAIRecommendation("Tidak dapat memindahkan mesin. CQI sumber atau tujuan sedang dikunci (Locked).");
        return;
    }

    // Eksekusi pemindahan
    const sourceSlot = currentPlan[sourceCqiIndex];
    const targetSlot = currentPlan[targetCqiIndex];
    const machineIndex = sourceSlot.machines.findIndex(m => m.id === draggedMachineId);
    const machine = sourceSlot.machines[machineIndex];

    sourceSlot.machines.splice(machineIndex, 1);
    targetSlot.machines.push(machine);

    logActivity(`Operator memindahkan ${machine.name} dari ${sourceSlot.cqi.name} ke ${targetSlot.cqi.name}`);
    
    // Panggil Validasi brain.js
    validateMove(machine, sourceSlot, targetSlot);
    renderVisualEditor();
  }

  // Integrasi Validasi AI saat manual edit
  function validateMove(machine, from, to) {
    // Simulasi respons AI
    if (to.machines.length > 5) {
      to.status = 'OVERLOAD';
      showAIRecommendation(`⚠️ Peringatan: ${to.cqi.name} kelebihan kapasitas mesin (Max 5). Sebaiknya pindahkan kembali ${machine.name} ke ${from.cqi.name}.`);
    } else {
      to.status = 'NORMAL';
      from.status = 'NORMAL';
    }
  }

  // Utils & UI Helpers
  function getStatusClass(slot) {
    if(slot.status === 'OVERLOAD') return 'status-overload';
    if(slot.status === 'WARNING') return 'status-warning';
    return 'status-normal';
  }

  function showAIRecommendation(msg) {
    const popup = document.getElementById('aiAssistant');
    document.getElementById('aiMessage').innerText = msg;
    popup.classList.add('show');
    setTimeout(() => popup.classList.remove('show'), 5000);
  }

  function logActivity(text) {
    const list = document.getElementById('activityLog');
    const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    list.innerHTML = `<div class="log-item"><span class="time">${time}</span> ${text}</div>` + list.innerHTML;
  }

  function toggleLock(index) {
    currentPlan[index].isLocked = !currentPlan[index].isLocked;
    logActivity(`CQI ${currentPlan[index].cqi.name} ${currentPlan[index].isLocked ? 'dikunci' : 'dibuka'} oleh operator.`);
    renderVisualEditor();
  }

  function openDetail(index) {
    const slot = currentPlan[index];
    document.getElementById('modalTitle').innerText = slot.cqi.name;
    document.getElementById('modalBody').innerHTML = `
      <p><strong>Core:</strong> ${slot.core}</p>
      <p><strong>Non Core:</strong> ${slot.nonCore.length > 0 ? slot.nonCore.join(', ') : '-'}</p>
      <p><strong>Total Mesin:</strong> ${slot.machines.length}</p>
      <p><strong>Status Jarak:</strong> <span style="color:var(--success)">Aman (< 20m)</span></p>
      <hr style="border:0; border-top: 1px solid #cbd5e0; margin: 12px 0;">
      <p><strong>Riwayat Histori:</strong> Mesin di CQI ini memiliki kecocokan histori sebesar 92% dengan shift sebelumnya.</p>
    `;
    document.getElementById('detailModal').style.display = 'grid';
  }
  function closeModal() { document.getElementById('detailModal').style.display = 'none'; }

  function updateKPI() {
    let totalMachines = 0;
    currentPlan.forEach(s => totalMachines += s.machines.length);
    document.getElementById('kpi-machines').innerText = totalMachines;
    document.getElementById('kpi-cqi').innerText = currentPlan.length;
    document.getElementById('kpi-coverage').innerText = totalMachines > 0 ? '100%' : '0%';
  }

  // Inisialisasi Mock Data untuk Editor
  window.onload = () => {
    currentPlan = [
      { cqi: { name: 'CQI 01' }, core: 1, nonCore: ['Udin'], isLocked: false, status: 'NORMAL', machines: [{ id: 'm1', name: 'AST 60-01' }, { id: 'm2', name: 'AST 60-02' }] },
      { cqi: { name: 'CQI 02' }, core: 1, nonCore: [], isLocked: false, status: 'NORMAL', machines: [{ id: 'm3', name: 'AST 60-03' }] }
    ];
    renderVisualEditor();
    logActivity("Sistem Editor siap digunakan.");
  }
</script>
</body>
</html>
