<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konfigurasi Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-hover: #f1f5f9;
    --border: #cbd5e1;
    --text-main: #0f172a;
    --text-muted: #475569;
    --text-subtle: #94a3b8;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --success: #16a34a;
    --success-bg: #dcfce7;
    --warning: #d97706;
    --danger: #dc2626;
    --radius: 10px;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; }

  /* Header */
  .topbar { height: 64px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.03); position: sticky; top: 0; z-index: 100; }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  
  .back-btn { text-decoration: none; color: #fff; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; padding: 9px 18px; border-radius: 6px; background: var(--accent); border: 1px solid var(--accent); transition: 0.2s; box-shadow: 0 4px 6px -1px rgba(37,99,235,0.2); }
  .back-btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  
  .topbar h1 { font-size: 16px; font-weight: 600; margin: 0; color: var(--accent); border-left: 2px solid var(--border); padding-left: 16px; }
  .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; background: #e2e8f0; color: var(--text-muted); }
  .badge.ok { background: var(--success-bg); color: var(--success); }

  /* Container */
  .container { max-width: 1400px; width: 100%; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; flex: 1; }

  /* Realtime Dashboard */
  .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .stat-card { background: var(--surface); padding: 18px 20px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between; }
  .stat-card p { margin: 0; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
  .stat-card span { margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; color: var(--text-main); }
  .stat-card.highlight { border-color: var(--accent); background: #eff6ff; }
  .stat-card.highlight span { color: var(--accent); }

  /* Pengaturan Manpower 3 Kolom */
  .settings-section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; }
  .cols-3-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 1024px) { .cols-3-grid { grid-template-columns: 1fr; } }

  /* Kotak Kolom Manpower */
  .config-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
  .box-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 10px; gap: 8px; }
  .box-header h3 { margin: 0; font-size: 13px; font-weight: 700; color: var(--text-main); text-transform: uppercase; flex: 1; }
  .count-badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; background: var(--bg); padding: 2px 8px; border-radius: 4px; font-weight: 600; color: var(--text-muted); border: 1px solid var(--border); flex-shrink: 0; }

  /* Styling Tombol Rolling */
  .rolling-group { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
  .rolling-group .icon-btn { border: none; border-radius: 0; background: transparent; height: 26px; width: 26px; display: grid; place-items: center; color: var(--text-muted); font-size: 10px; cursor: pointer; transition: 0.2s; }
  .rolling-group .icon-btn:not(:last-child) { border-right: 1px solid var(--border); }
  .rolling-group .icon-btn:hover { background: #e2e8f0; color: var(--text-main); }

  /* List container memanjang ke bawah tanpa scrollbar */
  .list-container { display: flex; flex-direction: column; gap: 6px; }
  
  .list-item { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--border); background: var(--surface); border-radius: 6px; transition: 0.2s; }
  .list-item:hover { border-color: #94a3b8; }
  .list-item .num { width: 22px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-subtle); flex-shrink: 0; }
  .list-item input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text-main); font-size: 13px; font-family: inherit; font-weight: 500; }
  .list-item input::placeholder { color: #cbd5e1; }

  .icon-btn { width: 26px; height: 26px; display: grid; place-items: center; border: none; background: transparent; color: var(--text-muted); border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s; flex-shrink: 0; }
  .icon-btn:hover { background: #e2e8f0; color: var(--text-main); }
  .icon-btn.del:hover { color: var(--danger); background: #fee2e2; }

  .add-btn { width: 100%; padding: 8px; border: 1px dashed var(--border); background: transparent; color: var(--text-muted); border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; text-align: center; margin-top: 4px; }
  .add-btn:hover { border-color: var(--accent); color: var(--accent); background: #eff6ff; }

  /* Sub-fields di kolom */
  .sub-fields-group { display: flex; flex-direction: column; gap: 12px; }
  .field-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
  .field-group input { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-main); font-size: 13px; font-family: inherit; outline: none; transition: 0.2s; }
  .field-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

  /* Alert Box */
  .alert-container { display: flex; flex-direction: column; gap: 8px; }
  .alert-card { padding: 12px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; display: flex; align-items: flex-start; gap: 10px; border: 1px solid transparent; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  .alert-card.info { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
  .alert-card.success { background: var(--success-bg); border-color: #bbf7d0; color: #166534; }
  .alert-card.warning { background: #fef3c7; border-color: #fde68a; color: #92400e; }
  .alert-card.danger { background: #fee2e2; border-color: #fecaca; color: #991b1b; }

  /* Output Planning Section */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; }
  .card-head h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--text-main); }
  .card-head p { margin: 4px 0 0; font-size: 13px; color: var(--text-muted); }
  .card-head .meta { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-subtle); background: var(--bg); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); }

  #textOutput { width: 100%; height: 320px; resize: vertical; border-radius: 8px; border: 1px solid var(--border); background: #f8fafc; padding: 16px; color: var(--text-main); font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6; outline: none; transition: 0.2s; }
  #textOutput:focus { border-color: var(--accent); background: var(--surface); }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-main); transition: 0.2s; font-family: inherit; }
  .btn:hover { background: var(--surface-hover); border-color: #94a3b8; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 6px -1px rgba(37,99,235,0.2); }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-ok { border-color: var(--success); background: var(--success-bg); color: #166534; }
  .btn-ok:hover { background: #bbf7d0; }
</style>
</head>
<body>

  <!-- Header -->
  <header class="topbar">
    <div class="topbar-left">
      <a class="back-btn" href="index.html">Kembali ke Map</a>
      <h1>Konfigurasi Planning Liquid 3</h1>
      <span class="badge" id="statusBadge">Brain.AI</span>
    </div>
    <div>
      <button class="btn btn-primary" onclick="executePlan()">GENERATE</button>
    </div>
  </header>

  <div class="container">

    <!-- Realtime Dashboard -->
    <section class="dashboard-grid">
      <div class="stat-card highlight">
        <p>Mesin Running</p>
        <span id="db-running">0</span>
      </div>
      <div class="stat-card highlight">
        <p>CQI Ready</p>
        <span id="db-cqi-ready">0</span>
      </div>
      <div class="stat-card">
        <p>Total Core</p>
        <span id="db-core">0</span>
      </div>
      <div class="stat-card">
        <p>Total Non-Core</p>
        <span id="db-noncore">0</span>
      </div>
      <div class="stat-card">
        <p>Total Longshift</p>
        <span id="db-ls">0</span>
      </div>
      <div class="stat-card">
        <p>Total Mesin Ter-cover</p>
        <span id="db-covered">0</span>
      </div>
    </section>

    <!-- Pengaturan Manpower 3 Kolom (Longshift dipindah ke bawah Non-Core) -->
    <div>
      <div class="cols-3-grid">
        
        <!-- Kolom 1: Core Manpower -->
        <div class="config-box">
          <div class="box-header">
            <h3>Core Manpower</h3>
            <div class="rolling-group">
              <button class="icon-btn" title="Rotasi naik" onclick="shiftList('core', -1)">▲</button>
              <button class="icon-btn" title="Rotasi turun" onclick="shiftList('core', 1)">▼</button>
            </div>
            <span class="count-badge" id="cnt-core">0</span>
          </div>
          <div class="list-container" id="coreListContainer"></div>
          <button class="add-btn" onclick="addManpowerItem('core')">+ Tambah Core</button>
        </div>

        <!-- Kolom 2: Non-Core Manpower (Di atas) & Longshift (Di bawahnya) -->
        <div style="display: flex; flex-direction: column; gap: 20px;">
          <!-- Non-Core Box -->
          <div class="config-box">
            <div class="box-header">
              <h3>Non-Core Manpower</h3>
              <div class="rolling-group">
                <button class="icon-btn" title="Rotasi naik" onclick="shiftList('nonCore', -1)">▲</button>
                <button class="icon-btn" title="Rotasi turun" onclick="shiftList('nonCore', 1)">▼</button>
              </div>
              <span class="count-badge" id="cnt-noncore">0</span>
            </div>
            <div class="list-container" id="nonCoreListContainer"></div>
            <button class="add-btn" onclick="addManpowerItem('nonCore')">+ Tambah Non-Core</button>
          </div>

          <!-- Longshift Box (Dipindah ke bawah Non-Core) -->
          <div class="config-box">
            <div class="box-header">
              <h3>Longshift (LS)</h3>
              <span class="count-badge" id="cnt-ls">0</span>
            </div>
            <div class="sub-fields-group">
              <div class="field-group">
                <label>Jumlah Longshift</label>
                <input type="number" id="ncLongshiftCount" min="0" value="0" placeholder="0" oninput="localStorage.setItem('ncls_count', this.value); updateDashboardStats();">
              </div>
            </div>
          </div>
        </div>

        <!-- Kolom 3: QC Passed & Tugas Khusus (Mil-Std, Standby OT, Support FG) -->
        <div class="config-box">
          <div class="box-header">
            <h3>Tugas Khusus</h3>
            <div class="rolling-group">
              <button class="icon-btn" title="Rotasi naik" onclick="shiftList('qcPassed', -1)">▲</button>
              <button class="icon-btn" title="Rotasi turun" onclick="shiftList('qcPassed', 1)">▼</button>
            </div>
            <span class="count-badge" id="cnt-qc">0/5</span>
          </div>
          <div class="sub-fields-group">
            <div class="field-group">
              <label>QC Passed</label>
              <div class="list-container" id="qcPassedContainer"></div>
              <button class="add-btn" id="addQcBtn" onclick="addQcItem()">+ Tambah QC Passed</button>
            </div>
            <div class="field-group">
              <label>Mil-Std</label>
              <input type="text" id="milStdInput" placeholder="Nama Mil-Std..." oninput="localStorage.setItem('milStd_val', this.value)">
            </div>
            <div class="field-group">
              <label>Standby OT</label>
              <input type="text" id="standbyOtInput" placeholder="Nama Standby OT..." oninput="localStorage.setItem('standbyOt_val', this.value)">
            </div>
            <div class="field-group">
              <label>Support FG</label>
              <input type="text" id="supportFgInput" placeholder="Nama Support FG..." oninput="localStorage.setItem('supportFg_val', this.value)">
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Alert / Notifikasi Validasi di bawah pengaturan manpower -->
    <div id="alertContainer" class="alert-container"></div>

    <!-- Output Planning Section -->
    <section class="card">
      <div class="card-head">
        <div>
          <h2>Planning LIQUID 3</h2>
        </div>
        <span class="meta" id="lineMeta">Brain.AI</span>
      </div>
      <textarea id="textOutput" spellcheck="false" placeholder="Klik tombol 'Generate Planning' di atas untuk memproses alokasi shift..." oninput="updateMeta()"></textarea>
      <div class="actions">
        <button class="btn btn-ok" onclick="validateAndExport()">✓ Validasi &amp; Copy</button>
        <button class="btn" onclick="shareWA()">💬 Kirim ke WhatsApp</button>
        <button class="btn" onclick="exportExcel()">📊 Export ke Excel</button>
      </div>
    </section>

  </div>

<script src="brain.js"></script>
<script>
  let state = null;
  let currentPlan = [];
  let manpowerData = { core: [], nonCore: [], qcPassed: [] };

  window.onload = async () => {
    try {
      const rawState = sessionStorage.getItem('planning_state');
      if (rawState) {
        state = JSON.parse(rawState);
      }
    } catch(e) {}

    if (!state || !state.machines) {
      try {
        const fallback = JSON.parse(localStorage.getItem('factory_internal_storage'));
        if (fallback) {
          state = {
            machines: (fallback.machines || []).filter(m => m.status === 'RUNNING'),
            cqis: (fallback.cqis || []).filter(c => c.status === 'READY'),
            labels: []
          };
        }
      } catch(e) {}
    }

    if (!state || !state.machines || state.machines.length === 0) {
      alert("Tidak ada mesin dengan status RUNNING yang dikirim dari Map. Silakan pilih mesin RUNNING terlebih dahulu di index.html.");
      window.location.href = 'index.html';
      return;
    }

    document.getElementById('db-running').innerText = state.machines.length;
    document.getElementById('db-cqi-ready').innerText = state.cqis.length;

    document.getElementById('ncLongshiftCount').value = localStorage.getItem('ncls_count') || 0;

    await loadManpowerData();
    loadExtraConfigs();
    renderAllLists();
    updateDashboardStats();
  };

  async function loadManpowerData() {
    let savedCore = localStorage.getItem('manpower_core');
    let savedNonCore = localStorage.getItem('manpower_noncore');
    let savedQc = localStorage.getItem('manpower_qc');

    if (savedCore || savedNonCore || savedQc) {
      try {
        manpowerData.core = savedCore ? JSON.parse(savedCore) : [];
        manpowerData.nonCore = savedNonCore ? JSON.parse(savedNonCore) : [];
        manpowerData.qcPassed = savedQc ? JSON.parse(savedQc) : [];
        return;
      } catch(e) {}
    }

    try {
      const res = await fetch('https://raw.githubusercontent.com/IPCQuality/PLANING-MAKER/refs/heads/main/data/manpower.json');
      if (!res.ok) throw new Error();
      const data = await res.json();
      
      manpowerData.core = data.core || [];
      
      let rawNonCore = data.nonCore || data.noncore || [];
      let qcList = [];
      let filteredNonCore = [];
      let milstdName = '';
      let standbyotName = '';
      let supportfgName = '';

      rawNonCore.forEach(item => {
        let jobP = item.job_priority ? String(item.job_priority).trim().toLowerCase() : '';
        if (jobP === 'qcpassed' || jobP === 'qc' || jobP === 'qc-passed') {
          qcList.push(item);
        } else if (jobP === 'milstd') {
          milstdName = item.name;
        } else if (jobP === 'standbyot') {
          standbyotName = item.name;
        } else if (jobP === 'supportfg') {
          supportfgName = item.name;
        } else {
          filteredNonCore.push(item);
        }
      });

      manpowerData.nonCore = filteredNonCore;
      manpowerData.qcPassed = qcList;

      if (milstdName && !localStorage.getItem('milStd_val')) document.getElementById('milStdInput').value = milstdName;
      if (standbyotName && !localStorage.getItem('standbyOt_val')) document.getElementById('standbyOtInput').value = standbyotName;
      if (supportfgName && !localStorage.getItem('supportFg_val')) document.getElementById('supportFgInput').value = supportfgName;

      persistManpower();
    } catch(err) {
      console.warn("Gagal fetch manpower.json, menggunakan data kosong.");
      manpowerData = { core: [], nonCore: [], qcPassed: [] };
    }
  }

  function persistManpower() {
    localStorage.setItem('manpower_core', JSON.stringify(manpowerData.core));
    localStorage.setItem('manpower_noncore', JSON.stringify(manpowerData.nonCore));
    localStorage.setItem('manpower_qc', JSON.stringify(manpowerData.qcPassed));
  }

  function renderAllLists() {
    renderList('coreListContainer', manpowerData.core, 'core');
    renderList('nonCoreListContainer', manpowerData.nonCore, 'nonCore');
    renderQcList();
    updateDashboardStats();
  }

  function renderList(containerId, listArray, type) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';

    listArray.forEach((item, index) => {
      const row = document.createElement('div');
      row.className = 'list-item';

      const num = document.createElement('span');
      num.className = 'num';
      num.innerText = String(index + 1).padStart(2, '0');

      const input = document.createElement('input');
      input.type = 'text';
      input.value = typeof item === 'object' ? (item.name || '') : item;
      input.placeholder = 'Nama manpower...';
      input.oninput = (e) => {
        if (typeof listArray[index] === 'object') {
          listArray[index].name = e.target.value;
        } else {
          listArray[index] = e.target.value;
        }
        persistManpower();
        updateDashboardStats();
      };

      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn del';
      delBtn.innerHTML = '✕';
      delBtn.title = 'Hapus baris';
      delBtn.onclick = () => {
        listArray.splice(index, 1);
        persistManpower();
        renderAllLists();
      };

      row.appendChild(num);
      row.appendChild(input);
      row.appendChild(delBtn);
      container.appendChild(row);
    });

    let badgeId = type === 'core' ? 'cnt-core' : type === 'nonCore' ? 'cnt-noncore' : null;
    if (badgeId && document.getElementById(badgeId)) {
      document.getElementById(badgeId).innerText = listArray.length;
    }
  }

  function renderQcList() {
    const container = document.getElementById('qcPassedContainer');
    container.innerHTML = '';

    manpowerData.qcPassed.forEach((item, index) => {
      const row = document.createElement('div');
      row.className = 'list-item';

      const num = document.createElement('span');
      num.className = 'num';
      num.innerText = String(index + 1).padStart(2, '0');

      const input = document.createElement('input');
      input.type = 'text';
      input.value = typeof item === 'object' ? (item.name || '') : item;
      input.placeholder = 'Nama QC Passed...';
      input.oninput = (e) => {
        if (typeof manpowerData.qcPassed[index] === 'object') {
          manpowerData.qcPassed[index].name = e.target.value;
        } else {
          manpowerData.qcPassed[index] = e.target.value;
        }
        persistManpower();
      };

      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn del';
      delBtn.innerHTML = '✕';
      delBtn.title = 'Hapus baris';
      delBtn.onclick = () => {
        manpowerData.qcPassed.splice(index, 1);
        persistManpower();
        renderAllLists();
      };

      row.appendChild(num);
      row.appendChild(input);
      row.appendChild(delBtn);
      container.appendChild(row);
    });

    document.getElementById('cnt-qc').innerText = `${manpowerData.qcPassed.length}/5`;

    const addBtn = document.getElementById('addQcBtn');
    if (manpowerData.qcPassed.length >= 5) {
      addBtn.style.display = 'none';
    } else {
      addBtn.style.display = 'block';
    }
  }

  function addManpowerItem(type) {
    let newItem = { id: type.toUpperCase().substring(0,2) + Date.now(), name: '', cqi_priority: '', job_priority: '' };
    if (type === 'core') manpowerData.core.push(newItem);
    else if (type === 'nonCore') manpowerData.nonCore.push(newItem);

    persistManpower();
    renderAllLists();
    
    setTimeout(() => {
      let containerId = type === 'core' ? 'coreListContainer' : 'nonCoreListContainer';
      let inputs = document.querySelectorAll(`#${containerId} input`);
      if (inputs.length > 0) inputs[inputs.length - 1].focus();
    }, 50);
  }

  function addQcItem() {
    if (manpowerData.qcPassed.length >= 5) {
      alert("Maksimal QC Passed adalah 5 orang!");
      return;
    }
    let newItem = { id: 'QC' + Date.now(), name: '', job_priority: 'qcpassed' };
    manpowerData.qcPassed.push(newItem);
    persistManpower();
    renderAllLists();

    setTimeout(() => {
      let inputs = document.querySelectorAll('#qcPassedContainer input');
      if (inputs.length > 0) inputs[inputs.length - 1].focus();
    }, 50);
  }

  function shiftList(type, direction) {
    let list;
    if (type === 'core') list = manpowerData.core;
    else if (type === 'nonCore') list = manpowerData.nonCore;
    else if (type === 'qcPassed') list = manpowerData.qcPassed;

    if (!list || list.length <= 1) return;
    if (direction === -1) {
      list.push(list.shift());
    } else if (direction === 1) {
      list.unshift(list.pop());
    }
    persistManpower();
    renderAllLists();
  }

  function loadExtraConfigs() {
    document.getElementById('milStdInput').value = localStorage.getItem('milStd_val') || '';
    document.getElementById('standbyOtInput').value = localStorage.getItem('standbyOt_val') || '';
    document.getElementById('supportFgInput').value = localStorage.getItem('supportFg_val') || '';
  }

  function updateDashboardStats() {
    let validCore = manpowerData.core.filter(i => (typeof i === 'object' ? i.name : i).trim() !== '').length;
    let validNonCore = manpowerData.nonCore.filter(i => (typeof i === 'object' ? i.name : i).trim() !== '').length;
    let validLS = parseInt(document.getElementById('ncLongshiftCount').value) || 0;

    document.getElementById('db-core').innerText = validCore;
    document.getElementById('db-noncore').innerText = validNonCore;
    document.getElementById('db-ls').innerText = validLS;

    document.getElementById('cnt-ls').innerText = validLS;

    if (state && state.machines) {
      document.getElementById('db-covered').innerText = state.machines.length;
    }
  }

  function renderAlerts(infos = [], violations = []) {
    const container = document.getElementById('alertContainer');
    if (!container) return;
    container.innerHTML = '';

    infos.forEach(msg => {
      let type = 'info';
      let icon = '💡';
      if (msg.includes('SUCCESS')) { type = 'success'; icon = '✅'; }
      else if (msg.includes('PERINGATAN KRITIS')) { type = 'warning'; icon = '🚨'; }

      const card = document.createElement('div');
      card.className = `alert-card ${type}`;
      card.innerHTML = `<span class="alert-icon">${icon}</span><div class="alert-body">${msg}</div>`;
      container.appendChild(card);
    });

    violations.forEach(err => {
      const card = document.createElement('div');
      card.className = 'alert-card danger';
      card.innerHTML = `<span class="alert-icon">❌</span><div class="alert-body"><strong>Pelanggaran Aturan:</strong> ${err}</div>`;
      container.appendChild(card);
    });
  }

  function executePlan() {
    if (!state || !state.machines) {
      alert("Data mesin running tidak ditemukan!");
      return;
    }

    let coreNames = manpowerData.core.map(i => typeof i === 'object' ? i.name : i).filter(n => n.trim() !== '');
    let nonCoreNames = manpowerData.nonCore.map(i => typeof i === 'object' ? i.name : i).filter(n => n.trim() !== '');
    let qcNames = manpowerData.qcPassed.map(i => typeof i === 'object' ? i.name : i).filter(n => n.trim() !== '');
    
    let lsCount = parseInt(document.getElementById('ncLongshiftCount').value) || 0;
    let longshiftNames = Array.from({length: lsCount}, () => "(LS)");

    let qcPassedFormatted = "";
    if (qcNames.length === 1) qcPassedFormatted = qcNames[0];
    else if (qcNames.length > 1) qcPassedFormatted = qcNames.map((n,i)=>`${i+1}. ${n}`).join('\n');

    let finalConfig = {
      coreData: manpowerData.core,
      coreNames: coreNames,
      core: coreNames.length > 0 ? coreNames.length : 1,
      
      nonCoreData: manpowerData.nonCore,
      nonCoreNames: nonCoreNames,
      nonCore: nonCoreNames.length,
      
      longshiftData: longshiftNames,
      longshiftNames: longshiftNames,
      longshift: lsCount,
      
      qcPassed: qcPassedFormatted,
      qcPassedNames: qcNames,
      
      milStd: document.getElementById('milStdInput').value,
      standbyOt: document.getElementById('standbyOtInput').value,
      supportFg: document.getElementById('supportFgInput').value
    };

    currentPlan = BrainAI.generatePlan(state.machines, state.cqis, finalConfig);

    let validationReport = BrainAI.validate(currentPlan, state.machines);
    renderAlerts(validationReport.info, validationReport.violations);

    const planPayload = {
      version: 1,
      updatedAt: new Date().toISOString(),
      slots: JSON.parse(JSON.stringify(currentPlan))
    };
    
    sessionStorage.setItem('active_planning', JSON.stringify(planPayload));
    localStorage.setItem('last_active_planning', JSON.stringify(planPayload));

    generateTextOutput(finalConfig);

    const badge = document.getElementById('statusBadge');
    badge.innerText = 'Generated Sukses';
    badge.classList.add('ok');
  }

  function generateTextOutput(config) {
    if (!currentPlan || currentPlan.length === 0) return;
    document.getElementById('textOutput').value = BrainAI.formatText(currentPlan, config);
    updateMeta();
  }

  function updateMeta() {
    const v = document.getElementById('textOutput').value;
    document.getElementById('lineMeta').innerText = v ? (v.split('\n').length + ' baris teks') : 'kosong';
  }

  function validateAndExport() {
    if (!currentPlan || currentPlan.length === 0) {
      alert("Silakan klik 'Generate Planning' terlebih dahulu!");
      return;
    }

    let report = BrainAI.validate(currentPlan, state.machines);
    renderAlerts(report.info, report.violations);

    if (!report.valid) {
      alert("VALIDASI GAGAL! Periksa catatan pelanggaran pada kotak notifikasi di bawah.");
      return;
    }

    currentPlan.forEach(slot => slot.machines.forEach(m => BrainAI.recordHistory(m.id, slot.cqi.id, true)));
    
    navigator.clipboard.writeText(document.getElementById('textOutput').value);
    alert("Validasi Lulus! Hasil planning berhasil disalin ke Clipboard.");
  }

  function shareWA() {
    let text = document.getElementById('textOutput').value;
    if (!text) {
      alert("Belum ada teks planning untuk dibagikan!");
    }
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
  }

  const EXCELJS_CDN = "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
  function loadExcelJS(){
    if(window.ExcelJS) return Promise.resolve();
    return new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src=EXCELJS_CDN; s.onload=res; s.onerror=()=>rej(new Error('Gagal memuat library Excel.'));
      document.head.appendChild(s);
    });
  }

  const XL = { accent:'FF2563EB', accentDark:'FF1E3A8A', soft:'FFEFF6FF', zebra:'FFF8FAFC', line:'FFCBD5E1', text:'FF1E293B', white:'FFFFFFFF' };
  const thin = c => ({ style:'thin', color:{argb:c||XL.line} });
  const boxBorder = c => ({ top:thin(c), left:thin(c), bottom:thin(c), right:thin(c) });

  async function exportExcel() {
    if (!currentPlan || currentPlan.length === 0) {
      alert("Generate planning terlebih dahulu sebelum export Excel!");
      return;
    }
    try { await loadExcelJS(); } catch(e){ return alert(e.message); }

    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Planning Shift', {
      views:[{ state:'frozen', ySplit:0 }],
      pageSetup:{ orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0 }
    });

    const headers = ["NO","CQI","CORE","NON CORE","LS","MESIN (WORKSTATION/KODE)","LINE"];
    const rows = currentPlan.map((slot,i)=>{
      let nc = slot.nonCore && slot.nonCore.length > 0 ? slot.nonCore.join(" & ") : "-";
      let ls = slot.longshift && slot.longshift.length > 0 ? slot.longshift.join(" & ") : "-";
      return [ i+1, slot.cqi.name, String(slot.core), nc, ls, BrainAI.formatMachineList(slot.machines), slot.cqi.line || "-" ];
    });

    const lastCol = headers.length;
    const title = ws.addRow(["PLANNING SHIFT — LIQUID 3"]);
    ws.mergeCells(title.number, 1, title.number, lastCol);
    title.height = 28;
    const tCell = ws.getCell(title.number, 1);
    tCell.font = { name:'Arial', size:14, bold:true, color:{argb:XL.white} };
    tCell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XL.accentDark} };
    tCell.alignment = { vertical:'middle', horizontal:'center' };

    const stampText = "Dibuat: " + new Date().toLocaleString('id-ID') + "   |   Total CQI: " + currentPlan.length + "   |   Total Mesin: " + currentPlan.reduce((a,s)=>a+s.machines.length,0);
    const stamp = ws.addRow([stampText]);
    ws.mergeCells(stamp.number, 1, stamp.number, lastCol);
    const sCell = ws.getCell(stamp.number, 1);
    sCell.font = { name:'Arial', size:9, italic:true, color:{argb:'FF64748B'} };
    sCell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XL.soft} };
    sCell.alignment = { vertical:'middle', horizontal:'center' };
    ws.addRow([]);

    const headRow = ws.addRow(headers);
    headRow.height = 22;
    headRow.eachCell(c=>{
      c.font = { name:'Arial', size:11, bold:true, color:{argb:XL.white} };
      c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XL.accent} };
      c.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
      c.border = boxBorder(XL.accentDark);
    });

    rows.forEach((r,i)=>{
      const row = ws.addRow(r);
      row.eachCell({ includeEmpty:true }, (c,col)=>{
        c.font = { name:'Arial', size:10, color:{argb:XL.text} };
        c.alignment = { vertical:'middle', wrapText:true, horizontal:(col===1||col===3||col===7)?'center':'left' };
        c.border = boxBorder();
        if(i % 2 === 1) c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XL.zebra} };
      });
    });

    const buf = await wb.xlsx.writeBuffer();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    a.download = "Planning_Liquid_3.xlsx"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  }
</script>
